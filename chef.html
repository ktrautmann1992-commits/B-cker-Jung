<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bäcker Jung – Chef-Ansicht</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --blau:   #2E2A79;
    --blau-h: #4A44B0;
    --gelb:   #FFC800;
    --papier: #FBFAF6;
    --linie:  #DDDAE8;
    --grau:   #6B6880;
    --gruen:  #1E7B45;
    --rot:    #B32B28;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { max-width: 100%; overflow-x: hidden; }

  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--papier);
    color: #17162B;
    overflow-wrap: break-word;
  }

  /* ---------- Kopf ---------- */
  header {
    background: var(--blau);
    color: #fff;
    padding: 10px 14px;
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 11px;
  }
  header #logo {
    height: 34px; width: auto; flex: 0 0 auto;
    background: #fff; border-radius: 8px; padding: 4px 6px;
  }
  header h1 {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 17px;
    margin: 0; flex: 1; min-width: 0;
    letter-spacing: -0.01em;
  }
  header h1 span { color: var(--gelb); }
  header .stand {
    font-size: 10.5px; opacity: .72; display: block; font-weight: 600;
    font-family: 'Inter', sans-serif; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  header button {
    font-family: inherit; font-size: 13px; font-weight: 600;
    padding: 9px 12px; border-radius: 9px; flex: 0 0 auto;
    border: 1px solid rgba(255,255,255,.28);
    background: rgba(255,255,255,.08); color: #fff; cursor: pointer;
  }
  header button:active { background: rgba(255,255,255,.2); }

  main { max-width: 940px; margin: 0 auto; padding: 16px 14px 60px; }

  .karte {
    background: #fff;
    border: 1px solid var(--linie);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
    max-width: 100%;
    overflow-x: auto;
  }

  label.feldname {
    display: block;
    font-size: 11px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase;
    color: var(--grau); margin-bottom: 5px;
  }

  select, input[type=date], input[type=search], input[type=password] {
    width: 100%;
    font-family: inherit;
    font-size: 16px;
    padding: 11px 12px;
    border: 1px solid var(--linie);
    border-radius: 9px;
    background: #fff; color: inherit;
  }
  select:focus, input:focus {
    outline: none;
    border-color: var(--blau);
    box-shadow: 0 0 0 3px rgba(46,42,121,.12);
  }
  .raster { display: flex; gap: 10px; flex-wrap: wrap; }
  .raster > div { flex: 1 1 150px; min-width: 0; max-width: 100%; }

  /* ---------- Reiter ---------- */
  .reiter {
    display: flex; gap: 8px; margin-bottom: 14px;
    overflow-x: auto; scrollbar-width: none; padding-bottom: 2px;
    -webkit-overflow-scrolling: touch;
  }
  .reiter::-webkit-scrollbar { display: none; }
  .reiter button {
    font-family: inherit; font-size: 14px; font-weight: 600;
    padding: 10px 15px; border-radius: 9px;
    border: 1px solid var(--linie); background: #fff; color: var(--grau);
    cursor: pointer; flex: 0 0 auto; white-space: nowrap;
  }
  .reiter button.an { background: var(--blau); border-color: var(--blau); color: #fff; }

  /* ---------- Kennzahlen ---------- */
  .zahlen { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .zahl {
    flex: 1 1 120px;
    background: #fff; border: 1px solid var(--linie);
    border-radius: 12px; padding: 12px 14px;
  }
  .zahl b { display: block; font-family: 'Nunito', sans-serif; font-size: 24px; line-height: 1.1; }
  .zahl span {
    font-size: 11px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--grau);
  }

  /* ---------- Fehlende Filialen ---------- */
  .offen {
    background: #FFFBEA; border: 1px solid #F2E3A8;
    border-left: 4px solid var(--gelb);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; font-size: 14px;
  }
  .offen b { display: block; margin-bottom: 4px; }
  .offen span { color: var(--grau); }

  /* ---------- Bestellungen ---------- */
  .bestellung { border-bottom: 1px solid var(--linie); }
  .bestellung:last-child { border-bottom: none; }
  .kopfzeile {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 4px; cursor: pointer;
  }
  .kopfzeile:hover { background: #FAF9FE; }
  .kopfzeile .ort { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; }
  .kopfzeile .ort small {
    display: block; font-weight: 400; color: var(--grau); font-size: 12px; margin-top: 2px;
  }
  .kopfzeile .menge { text-align: right; font-size: 13px; color: var(--grau); white-space: nowrap; }
  .kopfzeile .menge b { display: block; color: #17162B; font-size: 15px; }
  .pfeil { color: var(--grau); font-size: 13px; width: 14px; }

  .details { padding: 2px 4px 16px; }
  .hinweis {
    background: #F4F2FB; border-left: 3px solid var(--blau);
    padding: 9px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; font-size: 11px; font-weight: 600;
    letter-spacing: .05em; text-transform: uppercase; color: var(--grau);
    padding: 6px 8px; border-bottom: 1px solid var(--linie);
  }
  td { padding: 7px 8px; border-bottom: 1px solid #F0EEF6; vertical-align: top; }
  td.zahl-rechts, th.zahl-rechts { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }

  .dateien { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .dateien a {
    font-size: 13px; font-weight: 600; text-decoration: none;
    padding: 8px 12px; border: 1px solid var(--linie); border-radius: 9px;
    background: #fff; color: var(--blau);
  }

  /* ---------- Produktion ---------- */
  .werkzeuge { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .werkzeuge button {
    font-family: inherit; font-size: 13px; font-weight: 600;
    padding: 10px 13px; border: 1px solid var(--linie); border-radius: 9px;
    background: #fff; color: var(--blau); cursor: pointer;
  }
  .aufteilung { color: var(--grau); font-size: 11.5px; margin-top: 3px; line-height: 1.45; }

  /* ---------- Meldungen ---------- */
  .meldung {
    margin: 0 0 14px; padding: 12px 14px;
    border-radius: 10px; font-size: 14px; border-left: 4px solid;
  }
  .meldung.fehler { background: #FBF0EF; border-color: var(--rot); color: var(--rot); }
  .meldung.ladend { background: #F4F2FB; border-color: var(--blau); color: var(--blau); }
  .meldung.gut    { background: #EEF7F1; border-color: var(--gruen); color: var(--gruen); }

  input.umsatz-feld {
    width: 118px; text-align: right;
    font-variant-numeric: tabular-nums; font-weight: 600;
    padding: 8px 10px;
  }

  /* ---------- Auswertung ---------- */
  h3.abschnitt {
    font-family: 'Nunito', sans-serif; font-size: 15px;
    margin: 22px 0 10px; padding-top: 16px;
    border-top: 1px solid var(--linie);
  }
  h3.abschnitt:first-child { border-top: none; padding-top: 0; margin-top: 0; }

  .balken { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
  .balken .name { flex: 0 0 128px; }
  .balken .spur { flex: 1; background: #F0EEF6; border-radius: 5px; height: 16px; overflow: hidden; }
  .balken .fuellung { height: 100%; background: var(--blau); border-radius: 5px; }
  .balken .wert {
    flex: 0 0 96px; text-align: right; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .warnung { color: var(--rot); font-weight: 700; font-size: 13px; cursor: help; }
  .hoch { color: var(--gruen); font-weight: 600; }
  .runter { color: var(--rot); font-weight: 600; }

  /* ---------- Personal, Dienstplan, Kosten ---------- */
  input.klein, select.klein {
    width: 100%; min-width: 82px;
    padding: 7px 8px; font-size: 14px;
  }
  input.geld {
    width: 104px; text-align: right;
    font-variant-numeric: tabular-nums; padding: 7px 9px; font-size: 14px;
  }
  .rollen { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .rollen table { min-width: 720px; }
  .zeilenknopf {
    font-family: inherit; font-size: 12px; font-weight: 600;
    padding: 6px 9px; margin-left: 4px;
    border: 1px solid var(--linie); border-radius: 7px;
    background: #fff; color: var(--blau); cursor: pointer;
  }
  .zeilenknopf.loeschen { color: var(--rot); }
  .formularfeld { flex: 1 1 170px; margin-bottom: 10px; }

  .leer { padding: 34px 4px; text-align: center; color: var(--grau); font-size: 14px; line-height: 1.6; }
  .verstecken { display: none !important; }

  @media print {
    header, .reiter, .werkzeuge, #zahlen, .filterkarte, .offen { display: none !important; }
    body { background: #fff; }
    .karte { border: none; padding: 0; }
    main { padding: 0; max-width: none; }
  }
</style>
</head>

<script>
  var ENDPUNKT       = '/.netlify/functions/bestellungen';
  var ENDPUNKT_UMSATZ = '/.netlify/functions/umsatz';

  var bestellungen = [];
  var artikelInfo = {};   // nr -> {bez, einheit, vk}
  var alleFilialen = [];  // Ortsnamen aus der Bestell-Seite
  var offenIds = {};
  var ansicht = 'dashboard';
  var retourenListe = [];

  function el(id) { return document.getElementById(id); }
  function txt(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function euro(n) { return n.toFixed(2).replace('.', ',') + ' &euro;'; }

  // heute und morgen vorbelegen – das ist der Zeitraum, der den Chef interessiert
  var heute = new Date();
  var morgen = new Date(heute.getTime() + 86400000);
  el('von').value = heute.toISOString().slice(0, 10);
  el('bis').value = morgen.toISOString().slice(0, 10);

  // ---------- Start ----------
  melde('Daten werden geladen \u2026', 'ladend');
  laden(function (fehler) {
    if (fehler) melde(fehler, 'fehler');
    stammdatenLaden();
    dashboardLaden();
  });

  // ---------- Daten holen ----------
  function laden(fertig) {
    stammdatenLaden();
    fetch(ENDPUNKT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: '{}'
    })
    .then(function (a) {
      if (a.status === 404) throw new Error(
        'Die Bestellungen sind noch nicht angebunden. Sobald die Datei ' +
        'netlify/functions/bestellungen.js deployt ist, erscheinen sie hier.');
      if (!a.ok) throw new Error('Der Server antwortet mit Status ' + a.status + '.');
      return a.json();
    })
    .then(function (daten) {
      bestellungen = (daten.bestellungen || []).map(aufbereiten);
      retourenListe = (daten.retouren || []).map(aufbereiten);
      el('stand').textContent = 'Stand ' + new Date().toLocaleTimeString('de-DE',
        { hour: '2-digit', minute: '2-digit' }) + ' \u00b7 ' + bestellungen.length + ' Bestellungen';
      melde('', '');
      fertig(null);
    })
    .catch(function (fehler) { fertig(fehler.message); });
  }

  // Filialen und Artikel sind fest eingebaut – gleicher Stand wie die Bestellseite
  function stammdatenLaden() {
    if (alleFilialen.length) return;
    try {
      var daten = JSON.parse(el('stammdaten').textContent);
      (daten.artikel || []).forEach(function (a) { artikelInfo[a.nr] = a; });
      alleFilialen = (daten.filialen || []).map(function (f) { return f.ort; })
        .filter(function (o, i, l) { return l.indexOf(o) === i; });
      var aus = el('filter-filiale');
      alleFilialen.forEach(function (ort) {
        var o = document.createElement('option');
        o.value = ort; o.textContent = ort; aus.appendChild(o);
      });
    } catch (fehler) { /* ohne Stammdaten läuft die Ansicht weiter */ }
  }

  function aufbereiten(b) {
    var teile = String(b.datum || '').split('.');
    b.datumIso = teile.length === 3 ? teile[2] + '-' + teile[1] + '-' + teile[0] : '';
    b.posten = String(b.uebersicht || '').split('\n').map(function (zeile) {
      var s = zeile.split('\t');
      if (s.length < 3) return null;
      return { nr: s[0].trim(), bez: s[1].trim(), menge: parseInt(s[2], 10) || 0,
               geliefert: s.length > 3 ? (parseInt(s[3], 10) || 0) : 0 };
    }).filter(Boolean);
    b.wertZahl = parseFloat(String(b.warenwert || '0').replace(/[^\d,.-]/g, '').replace(',', '.')) || 0;
    return b;
  }

  // ---------- Filter ----------
  function gefiltert() {
    var von = el('von').value, bis = el('bis').value;
    var ort = el('filter-filiale').value;

    return bestellungen.filter(function (b) {
      if (von && b.datumIso && b.datumIso < von) return false;
      if (bis && b.datumIso && b.datumIso > bis) return false;
      if (ort && b.filiale !== ort) return false;
      return true;
    }).sort(function (a, b) {
      if (a.datumIso !== b.datumIso) return a.datumIso < b.datumIso ? -1 : 1;
      return String(a.filiale).localeCompare(String(b.filiale), 'de');
    });
  }

  ['von', 'bis', 'filter-filiale', 'suche'].forEach(function (id) {
    el(id).addEventListener('input', zeichnen);
    el(id).addEventListener('change', zeichnen);
  });

  var ANSICHTEN = ['dashboard', 'verkauf', 'bestellungen', 'produktion', 'umsatz',
                   'auswertung', 'personal', 'dienstplan', 'kosten'];

  ANSICHTEN.forEach(function (name) {
    el('reiter-' + name).addEventListener('click', function () { wechseln(name); });
  });

  function wechseln(neu) {
    ansicht = neu;
    ANSICHTEN.forEach(function (name) {
      el('reiter-' + name).classList.toggle('an', name === neu);
      el('bereich-' + name).classList.toggle('verstecken', name !== neu);
    });
    if (neu === 'dashboard') dashboardLaden();
    else if (neu === 'verkauf') verkaufLaden();
    else if (neu === 'umsatz') umsatzTagLaden();
    else if (neu === 'auswertung') auswertungLaden();
    else if (neu === 'personal') personalLaden();
    else if (neu === 'dienstplan') dienstplanLaden();
    else if (neu === 'kosten') kostenLaden();
    else zeichnen();
  }

  el('neuladen').addEventListener('click', function () {
    el('neuladen').disabled = true;
    melde('Bestellungen werden geladen \u2026', 'ladend');
    laden(function (fehler) {
      el('neuladen').disabled = false;
      if (fehler) { melde(fehler, 'fehler'); return; }
      zeichnen();
    });
  });

  // ---------- Zeichnen ----------
  function zeichnen() {
    var liste = gefiltert();
    zahlenZeichnen(liste);
    offeneFilialen(liste);
    if (ansicht === 'bestellungen') bestellungenZeichnen(liste);
    else if (ansicht === 'produktion') produktionZeichnen(liste);
    else if (ansicht === 'umsatz') umsatzZeichnen();
  }

  function zahlenZeichnen(liste) {
    var stueck = 0, wert = 0, posten = 0, orte = {};
    liste.forEach(function (b) {
      stueck += parseInt(b.stueck, 10) || 0;
      posten += parseInt(b.positionen, 10) || 0;
      wert   += b.wertZahl;
      orte[b.filiale] = true;
    });
    el('zahlen').innerHTML =
      kachel(liste.length, liste.length === 1 ? 'Bestellung' : 'Bestellungen') +
      kachel(Object.keys(orte).length, 'Filialen') +
      kachel(stueck, 'St\u00fcck') +
      kachel(euro(wert), 'Warenwert');
  }
  function kachel(wert, name) {
    return '<div class="zahl"><b>' + wert + '</b><span>' + name + '</span></div>';
  }

  function offeneFilialen(liste) {
    var ziel = el('offen');
    if (!alleFilialen.length || el('filter-filiale').value) { ziel.innerHTML = ''; return; }
    var da = {};
    liste.forEach(function (b) { da[b.filiale] = true; });
    var fehlt = alleFilialen.filter(function (o, i, l) {
      return l.indexOf(o) === i && !da[o];
    });
    ziel.innerHTML = fehlt.length
      ? '<div class="offen"><b>Noch keine Bestellung: ' + fehlt.length + ' von ' +
        new Set(alleFilialen).size + ' Filialen</b><span>' + txt(fehlt.join(' \u00b7 ')) + '</span></div>'
      : '';
  }

  function bestellungenZeichnen(liste) {
    var ziel = el('bereich-bestellungen');
    if (!liste.length) {
      ziel.innerHTML = '<div class="leer">F\u00fcr diesen Zeitraum liegt keine Bestellung vor.<br>' +
        'Zeitraum oder Filiale oben \u00e4ndern.</div>';
      return;
    }
    ziel.innerHTML = liste.map(function (b) {
      var auf = offenIds[b.id];
      return '<div class="bestellung">' +
        '<div class="kopfzeile" data-id="' + txt(b.id) + '">' +
          '<div class="pfeil">' + (auf ? '\u25be' : '\u25b8') + '</div>' +
          '<div class="ort">' + txt(b.filiale) +
            '<small>' + txt(b.datum) + ' \u00b7 ' + txt(b.besteller) +
            (b.bemerkung ? ' \u00b7 mit Bemerkung' : '') + '</small></div>' +
          '<div class="menge"><b>' + txt(b.stueck) + ' St\u00fcck</b>' +
            txt(b.positionen) + ' Positionen \u00b7 ' + txt(b.warenwert) + '</div>' +
        '</div>' +
        (auf ? detailsHtml(b) : '') +
      '</div>';
    }).join('');

    ziel.querySelectorAll('.kopfzeile').forEach(function (k) {
      k.addEventListener('click', function () {
        var id = k.dataset.id;
        if (offenIds[id]) delete offenIds[id]; else offenIds[id] = true;
        bestellungenZeichnen(gefiltert());
      });
    });
  }

  function detailsHtml(b) {
    var zeilen = b.posten.map(function (p) {
      var info = artikelInfo[p.nr] || {};
      return '<tr><td>' + txt(p.nr) + '</td><td>' + txt(p.bez) + '</td>' +
        '<td class="zahl-rechts"><b>' + p.menge + '</b></td>' +
        '<td class="zahl-rechts">' + (info.vk ? euro(info.vk * p.menge) : '&ndash;') + '</td></tr>';
    }).join('');

    var dateien = '';
    if (b.pdf) dateien += '<a href="' + txt(b.pdf) + '" target="_blank" rel="noopener">PDF &ouml;ffnen</a>';
    if (b.csv) dateien += '<a href="' + txt(b.csv) + '" target="_blank" rel="noopener">CSV laden</a>';

    return '<div class="details">' +
      (b.bemerkung ? '<div class="hinweis"><b>Bemerkung der Filiale:</b> ' + txt(b.bemerkung) + '</div>' : '') +
      '<table><thead><tr><th>Nr.</th><th>Bezeichnung</th>' +
      '<th class="zahl-rechts">Menge</th><th class="zahl-rechts">Wert</th></tr></thead>' +
      '<tbody>' + (zeilen || '<tr><td colspan="4">Keine Einzelpositionen \u00fcbermittelt.</td></tr>') +
      '</tbody></table>' +
      (dateien ? '<div class="dateien">' + dateien + '</div>' : '') +
    '</div>';
  }

  // ---------- Produktionsliste ----------
  function produktionsDaten(liste) {
    var suche = el('suche').value.trim().toLowerCase();
    var summe = {};
    liste.forEach(function (b) {
      b.posten.forEach(function (p) {
        if (suche && p.bez.toLowerCase().indexOf(suche) === -1 && p.nr.indexOf(suche) !== 0) return;
        if (!summe[p.nr]) summe[p.nr] = { nr: p.nr, bez: p.bez, menge: 0, orte: {} };
        summe[p.nr].menge += p.menge;
        summe[p.nr].orte[b.filiale] = (summe[p.nr].orte[b.filiale] || 0) + p.menge;
      });
    });
    return Object.keys(summe).map(function (k) { return summe[k]; })
      .sort(function (a, b) { return (parseInt(a.nr, 10) || 0) - (parseInt(b.nr, 10) || 0); });
  }

  function produktionZeichnen(liste) {
    var reihen = produktionsDaten(liste);
    var ziel = el('produktion-inhalt');
    if (!reihen.length) {
      ziel.innerHTML = '<div class="leer">F\u00fcr diesen Zeitraum liegt keine Bestellung vor.</div>';
      return;
    }
    var gesamt = reihen.reduce(function (s, r) { return s + r.menge; }, 0);
    ziel.innerHTML =
      '<table><thead><tr><th>Nr.</th><th>Artikel</th>' +
      '<th class="zahl-rechts">Gesamt</th></tr></thead><tbody>' +
      reihen.map(function (r) {
        var info = artikelInfo[r.nr] || {};
        var aufteilung = Object.keys(r.orte).sort().map(function (o) {
          return txt(o) + ' ' + r.orte[o];
        }).join(' \u00b7 ');
        return '<tr><td>' + txt(r.nr) + '</td>' +
          '<td>' + txt(r.bez) + '<div class="aufteilung">' + aufteilung + '</div></td>' +
          '<td class="zahl-rechts"><b>' + r.menge + '</b><br>' +
            '<span style="color:var(--grau);font-weight:400">' + txt(info.einheit || '') + '</span></td></tr>';
      }).join('') +
      '</tbody></table>' +
      '<div style="margin-top:14px;font-weight:600">' + reihen.length + ' Artikel \u00b7 ' +
        gesamt + ' St\u00fcck gesamt</div>';
  }

  el('produktion-druck').addEventListener('click', function () { window.print(); });

  el('produktion-csv').addEventListener('click', function () {
    var liste = gefiltert();
    var reihen = produktionsDaten(liste);
    if (!reihen.length) return;
    var orte = [];
    reihen.forEach(function (r) {
      Object.keys(r.orte).forEach(function (o) { if (orte.indexOf(o) === -1) orte.push(o); });
    });
    orte.sort();
    var kopf = ['Artikelnummer', 'Bezeichnung', 'Gesamt'].concat(orte);
    var zeilen = [kopf].concat(reihen.map(function (r) {
      return [r.nr, r.bez, String(r.menge)].concat(orte.map(function (o) {
        return r.orte[o] ? String(r.orte[o]) : '';
      }));
    }));
    var feld = function (w) {
      var s = String(w);
      return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    var csv = '\ufeff' + zeilen.map(function (r) { return r.map(feld).join(';'); }).join('\r\n') + '\r\n';
    var name = 'Produktion_' + el('von').value + '_bis_' + el('bis').value + '.csv';
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  });

  // ---------- Tagesumsatz ----------
  var umsaetze = {};        // Filiale -> Betrag für den gewählten Tag
  var hinweise = {};        // Filiale -> true, wenn der Umsatz gepr\u00fcft werden soll
  var nurAufGeraet = false; // true, wenn der Server nicht erreichbar ist

  el('umsatz-datum').value = heute.toISOString().slice(0, 10);
  el('umsatz-datum').addEventListener('change', umsatzTagLaden);

  function umsatzTagLaden() {
    var tag = el('umsatz-datum').value;
    if (!tag) return;
    meldeUmsatz('Umsätze werden geladen \u2026', 'ladend');
    fetch(ENDPUNKT_UMSATZ, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ aktion: 'lesen', datum: tag })
    })
    .then(function (a) { if (!a.ok) throw new Error('Status ' + a.status); return a.json(); })
    .then(function (daten) {
      umsaetze = daten.umsaetze || {};
      hinweise = daten.hinweise || {};
      nurAufGeraet = false;
      meldeUmsatz('', '');
      umsatzZeichnen();
    })
    .catch(function () {
      var gespeichert = vomGeraet(tag);
      umsaetze = gespeichert.umsaetze || gespeichert;
      hinweise = gespeichert.hinweise || {};
      nurAufGeraet = true;
      meldeUmsatz('Der Server speichert noch nicht. Die Umsätze liegen vorerst nur auf diesem Gerät.', 'fehler');
      umsatzZeichnen();
    });
  }

  function vomGeraet(tag) {
    try {
      var d = JSON.parse(localStorage.getItem('umsatz-' + tag) || '{}');
      return d.umsaetze ? d : { umsaetze: d, hinweise: {} };
    } catch (e) { return { umsaetze: {}, hinweise: {} }; }
  }

  function betrag(text) {
    var n = parseFloat(String(text).replace(/[^\d,.-]/g, '').replace(/\.(?=\d{3}\b)/g, '').replace(',', '.'));
    return isNaN(n) ? 0 : n;
  }

  function bestellwertProFiliale(tag) {
    var summe = {};
    bestellungen.forEach(function (b) {
      if (b.datumIso !== tag) return;
      summe[b.filiale] = (summe[b.filiale] || 0) + b.wertZahl;
    });
    return summe;
  }

  function umsatzZeichnen() {
    var tag = el('umsatz-datum').value;
    var ware = bestellwertProFiliale(tag);
    var orte = alleFilialen.slice();
    Object.keys(umsaetze).concat(Object.keys(ware)).forEach(function (o) {
      if (orte.indexOf(o) === -1) orte.push(o);
    });
    orte.sort(function (a, b) { return a.localeCompare(b, 'de'); });

    if (!orte.length) {
      el('umsatz-inhalt').innerHTML = '<div class="leer">Keine Filialen vorhanden.</div>';
      return;
    }

    var summeUmsatz = 0, summeWare = 0, summeSoll = 0;
    var zeilen = orte.map(function (ort) {
      var u = umsaetze[ort] || 0;
      var w = ware[ort] || 0;
      var soll = errechneterUmsatz(ort, tag);
      summeUmsatz += u; summeWare += w; summeSoll += soll;
      var warnung = hinweise[ort]
        ? ' <span class="warnung" title="Achtung Umsatz überprüfen">&#9650;!</span>' : '';
      return '<tr>' +
        '<td>' + txt(ort) + warnung + '</td>' +
        '<td class="zahl-rechts">' +
          '<input class="umsatz-feld" type="text" inputmode="decimal" data-ort="' + txt(ort) + '" ' +
          'value="' + (u ? u.toFixed(2).replace('.', ',') : '') + '" placeholder="0,00"></td>' +
        '<td class="zahl-rechts">' + (soll ? euro(soll) : '&ndash;') + '</td>' +
        '<td class="zahl-rechts">' + (w ? euro(w) : '&ndash;') + '</td>' +
        '<td class="zahl-rechts">' + (u && w ? (w / u * 100).toFixed(1).replace('.', ',') + '&nbsp;%' : '&ndash;') + '</td>' +
      '</tr>';
    }).join('');

    el('umsatz-inhalt').innerHTML =
      '<div class="rollen"><table><thead><tr><th>Filiale</th>' +
      '<th class="zahl-rechts">Tagesumsatz &euro;</th>' +
      '<th class="zahl-rechts">Errechnet</th>' +
      '<th class="zahl-rechts">Warenwert Lieferung</th>' +
      '<th class="zahl-rechts">Anteil</th></tr></thead><tbody>' + zeilen + '</tbody></table></div>' +
      '<div style="margin-top:14px;font-weight:600">Gesamt ' + euro(summeUmsatz) +
        ' \u00b7 errechnet ' + euro(summeSoll) +
        (summeUmsatz ? ' \u00b7 Warenanteil ' + (summeWare / summeUmsatz * 100).toFixed(1).replace('.', ',') + ' %' : '') +
      '</div>' +
      '<div class="aufteilung" style="margin-top:8px">Errechnet = gelieferte Menge minus Retoure zum ' +
      'Verkaufspreis. Das rote Zeichen bedeutet: der eingetragene Umsatz liegt darunter.</div>';

    el('umsatz-inhalt').querySelectorAll('.umsatz-feld').forEach(function (feld) {
      feld.addEventListener('change', function () {
        var ort = feld.dataset.ort;
        var wert = betrag(feld.value);
        if (wert > 0) {
          var soll = errechneterUmsatz(ort, el('umsatz-datum').value);
          if (soll > 0 && wert < soll) {
            window.alert('Achtung: der errechnete Umsatz für ' + ort + ' sollte ' +
              soll.toFixed(2).replace('.', ',') + ' EUR sein.\n\n' +
              'Eingetragen: ' + wert.toFixed(2).replace('.', ',') + ' EUR\n' +
              'Abweichung: ' + (soll - wert).toFixed(2).replace('.', ',') + ' EUR\n\n' +
              'Der Wert wird übernommen und mit einem Warnzeichen vermerkt.');
            hinweise[ort] = true;
          } else {
            delete hinweise[ort];
          }
          umsaetze[ort] = wert;
        } else {
          delete umsaetze[ort];
          delete hinweise[ort];
        }
        umsatzZeichnen();
      });
    });
  }

  el('umsatz-speichern').addEventListener('click', function () {
    var tag = el('umsatz-datum').value;
    el('umsatz-inhalt').querySelectorAll('.umsatz-feld').forEach(function (feld) {
      var wert = betrag(feld.value);
      if (wert > 0) umsaetze[feld.dataset.ort] = wert; else delete umsaetze[feld.dataset.ort];
    });
    try {
      localStorage.setItem('umsatz-' + tag, JSON.stringify({ umsaetze: umsaetze, hinweise: hinweise }));
    } catch (e) {}

    meldeUmsatz('Wird gespeichert \u2026', 'ladend');
    fetch(ENDPUNKT_UMSATZ, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ aktion: 'speichern', datum: tag, umsaetze: umsaetze, hinweise: hinweise })
    })
    .then(function (a) { if (!a.ok) throw new Error('Status ' + a.status); })
    .then(function () {
      nurAufGeraet = false;
      meldeUmsatz('Umsätze für den ' + tag.split('-').reverse().join('.') + ' gespeichert.', 'gut');
      setTimeout(function () { meldeUmsatz('', ''); }, 3000);
    })
    .catch(function () {
      nurAufGeraet = true;
      meldeUmsatz('Der Server speichert noch nicht. Die Umsätze liegen vorerst nur auf diesem Gerät.', 'fehler');
    });
  });

  el('umsatz-csv').addEventListener('click', function () {
    var tag = el('umsatz-datum').value;
    var ware = bestellwertProFiliale(tag);
    var orte = Object.keys(umsaetze).concat(alleFilialen)
      .filter(function (o, i, l) { return l.indexOf(o) === i; })
      .sort(function (a, b) { return a.localeCompare(b, 'de'); });
    var zeilen = [['Datum', 'Filiale', 'Tagesumsatz', 'Warenwert Bestellung', 'Anteil %']];
    orte.forEach(function (o) {
      var u = umsaetze[o] || 0, w = ware[o] || 0;
      zeilen.push([tag.split('-').reverse().join('.'), o,
        u ? u.toFixed(2).replace('.', ',') : '',
        w ? w.toFixed(2).replace('.', ',') : '',
        (u && w) ? (w / u * 100).toFixed(1).replace('.', ',') : '']);
    });
    var feld = function (w) {
      var s = String(w);
      return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    var csv = '\ufeff' + zeilen.map(function (r) { return r.map(feld).join(';'); }).join('\r\n') + '\r\n';
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = 'Tagesumsatz_' + tag + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  });

  function meldeUmsatz(text, art) {
    el('umsatz-meldung').innerHTML = text ? '<div class="meldung ' + art + '">' + txt(text) + '</div>' : '';
  }

  // ---------- Auswertung ----------
  var aTage = {}, aVorher = {}, aZeitraum = { von: '', bis: '' };

  (function jahreFuellen() {
    var jetzt = heute.getFullYear(), aus = el('a-jahr');
    for (var j = jetzt; j >= jetzt - 3; j--) {
      var o = document.createElement('option');
      o.value = j; o.textContent = j; aus.appendChild(o);
    }
    el('a-zeitraum').value = String(Math.floor(heute.getMonth() / 3) + 1);
    el('a-stichtag').value = heute.toISOString().slice(0, 10);
    feldSichtbarkeit();
  })();

  el('a-jahr').addEventListener('change', auswertungLaden);
  el('a-zeitraum').addEventListener('change', auswertungLaden);
  el('a-stichtag').addEventListener('change', auswertungLaden);
  el('a-art').addEventListener('change', function () {
    feldSichtbarkeit();
    auswertungLaden();
  });

  function feldSichtbarkeit() {
    var art = el('a-art').value;
    var mitStichtag = (art === 'tag' || art === 'woche' || art === 'monat');
    el('feld-stichtag').classList.toggle('verstecken', !mitStichtag);
    el('feld-jahr').classList.toggle('verstecken', mitStichtag);
    el('feld-quartal').classList.toggle('verstecken', art !== 'quartal');
  }

  function tagPlus(iso, tage) {
    var d = new Date(iso + 'T12:00:00');
    d.setDate(d.getDate() + tage);
    return d.toISOString().slice(0, 10);
  }
  function montagVon(iso) {
    var d = new Date(iso + 'T12:00:00');
    var abstand = (d.getDay() + 6) % 7;
    return tagPlus(iso, -abstand);
  }
  function kalenderwoche(iso) {
    var d = new Date(iso + 'T12:00:00');
    d.setDate(d.getDate() + 4 - ((d.getDay() + 6) % 7 + 1));
    var start = new Date(d.getFullYear(), 0, 1);
    return Math.ceil(((d - start) / 86400000 + 1) / 7);
  }
  function wochenSchluessel(iso) {
    var mo = montagVon(iso);
    return mo.slice(0, 4) + '-W' + zwei(kalenderwoche(mo));
  }

  function grenzen(jahr, wahl) {
    if (wahl === 'jahr') return { von: jahr + '-01-01', bis: jahr + '-12-31', name: 'Jahr ' + jahr };
    var q = parseInt(wahl, 10);
    var ersterMonat = (q - 1) * 3 + 1;
    var letzterTag = new Date(jahr, ersterMonat + 2, 0).getDate();
    return {
      von: jahr + '-' + zwei(ersterMonat) + '-01',
      bis: jahr + '-' + zwei(ersterMonat + 2) + '-' + zwei(letzterTag),
      name: q + '. Quartal ' + jahr
    };
  }

  // Zeitraum aus der Auswahl oben bestimmen
  function aktuellerZeitraum() {
    var art = el('a-art').value;
    var stichtag = el('a-stichtag').value || heute.toISOString().slice(0, 10);
    var jahr = parseInt(el('a-jahr').value, 10);

    if (art === 'tag') {
      return { von: stichtag, bis: stichtag, name: tagText(stichtag), art: art };
    }
    if (art === 'woche') {
      var mo = montagVon(stichtag);
      return { von: mo, bis: tagPlus(mo, 6), art: art,
               name: 'KW ' + kalenderwoche(mo) + ' (' + tagText(mo) + ' \u2013 ' + tagText(tagPlus(mo, 6)) + ')' };
    }
    if (art === 'monat') {
      var t = stichtag.split('-');
      var letzter = new Date(+t[0], +t[1], 0).getDate();
      return { von: t[0] + '-' + t[1] + '-01', bis: t[0] + '-' + t[1] + '-' + zwei(letzter), art: art,
               name: monatsnamen[+t[1] - 1] + ' ' + t[0] };
    }
    if (art === 'jahr') { var z = grenzen(jahr, 'jahr'); z.art = art; return z; }
    var q = grenzen(jahr, el('a-zeitraum').value); q.art = art; return q;
  }

  function vorherigerZeitraum(z) {
    if (z.art === 'tag') { var v = tagPlus(z.von, -1); return { von: v, bis: v, name: tagText(v) }; }
    if (z.art === 'woche') {
      var mo = tagPlus(z.von, -7);
      return { von: mo, bis: tagPlus(mo, 6), name: 'KW ' + kalenderwoche(mo) };
    }
    if (z.art === 'monat') {
      var t = z.von.split('-'); var jahr = +t[0], monat = +t[1] - 1;
      if (monat === 0) { monat = 12; jahr--; }
      var letzter = new Date(jahr, monat, 0).getDate();
      return { von: jahr + '-' + zwei(monat) + '-01', bis: jahr + '-' + zwei(monat) + '-' + zwei(letzter),
               name: monatsnamen[monat - 1] + ' ' + jahr };
    }
    if (z.art === 'jahr') return grenzen(parseInt(z.von.slice(0, 4), 10) - 1, 'jahr');
    var q = parseInt(el('a-zeitraum').value, 10), j = parseInt(el('a-jahr').value, 10);
    return q === 1 ? grenzen(j - 1, '4') : grenzen(j, String(q - 1));
  }
  function zwei(n) { return (n < 10 ? '0' : '') + n; }

  function zeitraumLaden(z) {
    return fetch(ENDPUNKT_UMSATZ, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ aktion: 'zeitraum', von: z.von, bis: z.bis })
    })
    .then(function (a) { if (!a.ok) throw new Error('Status ' + a.status); return a.json(); })
    .then(function (d) { return d.tage || {}; })
    .catch(function () { return vomGeraetZeitraum(z); });
  }

  function vomGeraetZeitraum(z) {
    var tage = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var schluessel = localStorage.key(i);
        if (schluessel.indexOf('umsatz-') !== 0) continue;
        var tag = schluessel.slice(7);
        if (tag < z.von || tag > z.bis) continue;
        var roh = JSON.parse(localStorage.getItem(schluessel) || '{}');
        tage[tag] = roh.umsaetze || roh;
      }
    } catch (e) {}
    return tage;
  }

  function auswertungLaden() {
    aZeitraum = aktuellerZeitraum();
    var vorher = vorherigerZeitraum(aZeitraum);
    aZeitraum.vorherName = vorher.name;
    meldeAuswertung('Zahlen werden geladen \u2026', 'ladend');
    Promise.all([
      zeitraumLaden(aZeitraum),
      zeitraumLaden(vorher),
      personalHolen(),
      kostenHolen(),
      dienstplaeneHolen(aZeitraum)
    ]).then(function (e) {
      aTage = e[0]; aVorher = e[1];
      meldeAuswertung('', '');
      auswertungZeichnen();
    });
  }

  function summieren(tage, von, bis) {
    var proFiliale = {}, proMonat = {}, gesamt = 0, tageMitZahlen = 0, bester = { tag: '', wert: 0 };
    Object.keys(tage).forEach(function (tag) {
      if (von && (tag < von || tag > bis)) return;
      var tagSumme = 0;
      Object.keys(tage[tag] || {}).forEach(function (ort) {
        var wert = Number(tage[tag][ort]) || 0;
        proFiliale[ort] = (proFiliale[ort] || 0) + wert;
        tagSumme += wert;
      });
      if (tagSumme > 0) {
        tageMitZahlen++;
        gesamt += tagSumme;
        var monat = tag.slice(0, 7);
        proMonat[monat] = (proMonat[monat] || 0) + tagSumme;
        if (tagSumme > bester.wert) bester = { tag: tag, wert: tagSumme };
      }
    });
    return { proFiliale: proFiliale, proMonat: proMonat, gesamt: gesamt, tage: tageMitZahlen, bester: bester };
  }

  function warenwertImZeitraum(von, bis) {
    var proFiliale = {}, gesamt = 0, anzahl = 0;
    bestellungen.forEach(function (b) {
      if (!b.datumIso || b.datumIso < von || b.datumIso > bis) return;
      proFiliale[b.filiale] = (proFiliale[b.filiale] || 0) + b.wertZahl;
      gesamt += b.wertZahl; anzahl++;
    });
    return { proFiliale: proFiliale, gesamt: gesamt, anzahl: anzahl };
  }

  function trend(jetzt, vorher) {
    if (!vorher) return '<span style="color:var(--grau)">&ndash;</span>';
    var p = (jetzt - vorher) / vorher * 100;
    var zeichen = p >= 0 ? '+' : '\u2212';
    return '<span class="' + (p >= 0 ? 'hoch' : 'runter') + '">' + zeichen +
      Math.abs(p).toFixed(1).replace('.', ',') + '&nbsp;%</span>';
  }

  var monatsnamen = ['Januar','Februar','M\u00e4rz','April','Mai','Juni',
                     'Juli','August','September','Oktober','November','Dezember'];
  function monatName(schluessel) {
    var t = schluessel.split('-');
    return monatsnamen[parseInt(t[1], 10) - 1] + ' ' + t[0];
  }
  function tagText(iso) { return iso.split('-').reverse().join('.'); }

  function auswertungZeichnen() {
    var jetzt = summieren(aTage, aZeitraum.von, aZeitraum.bis);
    var alt   = summieren(aVorher, '', '');
    var ware  = warenwertImZeitraum(aZeitraum.von, aZeitraum.bis);
    var ziel  = el('auswertung-inhalt');

    if (!jetzt.gesamt && !ware.gesamt) {
      ziel.innerHTML = '<div class="leer">F&uuml;r ' + txt(aZeitraum.name) +
        ' sind noch keine Zahlen erfasst.<br>Tagesums&auml;tze tr&auml;gst du im Reiter Tagesumsatz ein.</div>';
      return;
    }

    var schnitt = jetzt.tage ? jetzt.gesamt / jetzt.tage : 0;
    var anteil = jetzt.gesamt ? ware.gesamt / jetzt.gesamt * 100 : 0;
    var erg = ergebnisBlock(jetzt);
    var ergebnis = jetzt.gesamt - erg.lohn.gesamt - erg.fix.gesamt;
    aBericht = { jetzt: jetzt, alt: alt, ware: ware, erg: erg, ergebnis: ergebnis };

    var kacheln =
      kachel(euro(jetzt.gesamt), 'Umsatz ' + aZeitraum.name) +
      kachel(euro(schnitt), '\u00d8 pro Tag') +
      kachel(jetzt.tage, 'Tage erfasst') +
      kachel(euro(ware.gesamt), 'Warenwert bestellt') +
      kachel(anteil ? anteil.toFixed(1).replace('.', ',') + ' %' : '&ndash;', 'Warenanteil') +
      kachel(ware.anzahl, 'Bestellungen') +
      kachel(euro(erg.lohn.gesamt), 'Personalkosten') +
      kachel(jetzt.gesamt ? (erg.lohn.gesamt / jetzt.gesamt * 100).toFixed(1).replace('.', ',') + ' %' : '&ndash;', 'Personalquote') +
      kachel(euro(erg.fix.gesamt), 'Fixkosten') +
      kachel(euro(ergebnis), 'Ergebnis');

    // Monatsbalken
    var monate = Object.keys(jetzt.proMonat).sort();
    var maxMonat = Math.max.apply(null, monate.map(function (m) { return jetzt.proMonat[m]; }).concat([1]));
    var monatsBalken = monate.map(function (m) {
      return balken(monatName(m), jetzt.proMonat[m], maxMonat);
    }).join('') || '<div class="leer">Noch keine Monatswerte.</div>';

    // Filialen
    var orte = Object.keys(jetzt.proFiliale).concat(alleFilialen)
      .filter(function (o, i, l) { return l.indexOf(o) === i; })
      .sort(function (a, b) { return (jetzt.proFiliale[b] || 0) - (jetzt.proFiliale[a] || 0); });
    var maxOrt = Math.max.apply(null, orte.map(function (o) { return jetzt.proFiliale[o] || 0; }).concat([1]));

    var filialZeilen = orte.map(function (ort) {
      var u = jetzt.proFiliale[ort] || 0;
      var w = ware.proFiliale[ort] || 0;
      return '<tr><td>' + txt(ort) + '</td>' +
        '<td class="zahl-rechts"><b>' + euro(u) + '</b></td>' +
        '<td class="zahl-rechts">' + (jetzt.gesamt ? (u / jetzt.gesamt * 100).toFixed(1).replace('.', ',') + '&nbsp;%' : '&ndash;') + '</td>' +
        '<td class="zahl-rechts">' + euro(w) + '</td>' +
        '<td class="zahl-rechts">' + (u ? (w / u * 100).toFixed(1).replace('.', ',') + '&nbsp;%' : '&ndash;') + '</td>' +
        '<td class="zahl-rechts">' + trend(u, alt.proFiliale[ort] || 0) + '</td></tr>';
    }).join('');

    // Tagesrückblick
    var tage = Object.keys(aTage).filter(function (t) {
      return t >= aZeitraum.von && t <= aZeitraum.bis;
    }).sort().reverse();
    var tagesZeilen = tage.map(function (tag) {
      var werte = aTage[tag] || {};
      var summe = Object.keys(werte).reduce(function (s, o) { return s + (Number(werte[o]) || 0); }, 0);
      if (!summe) return '';
      var aufteilung = Object.keys(werte).sort().map(function (o) {
        return txt(o) + ' ' + euro(Number(werte[o]) || 0);
      }).join(' \u00b7 ');
      return '<tr><td>' + tagText(tag) + '<div class="aufteilung">' + aufteilung + '</div></td>' +
        '<td class="zahl-rechts"><b>' + euro(summe) + '</b></td></tr>';
    }).join('');

    ziel.innerHTML =
      '<div class="zahlen">' + kacheln + '</div>' +
      '<h3 class="abschnitt">Umsatz nach Monat</h3>' + monatsBalken +
      '<h3 class="abschnitt">Umsatz nach Filiale</h3>' +
      orte.map(function (o) { return balken(o, jetzt.proFiliale[o] || 0, maxOrt); }).join('') +
      '<h3 class="abschnitt">Kennzahlen je Filiale</h3>' +
      '<table><thead><tr><th>Filiale</th><th class="zahl-rechts">Umsatz</th>' +
      '<th class="zahl-rechts">Anteil</th><th class="zahl-rechts">Warenwert</th>' +
      '<th class="zahl-rechts">Warenquote</th><th class="zahl-rechts">ggü. ' +
      txt(aZeitraum.vorherName || '') + '</th></tr></thead><tbody>' + filialZeilen + '</tbody></table>' +
      erg.html +
      '<h3 class="abschnitt">Tagesr\u00fcckblick</h3>' +
      (tagesZeilen
        ? '<table><thead><tr><th>Tag</th><th class="zahl-rechts">Umsatz</th></tr></thead><tbody>' +
          tagesZeilen + '</tbody></table>'
        : '<div class="leer">Noch keine Tagesums\u00e4tze in diesem Zeitraum.</div>') +
      (jetzt.bester.tag
        ? '<div style="margin-top:14px;font-weight:600">Bester Tag: ' + tagText(jetzt.bester.tag) +
          ' mit ' + euro(jetzt.bester.wert) + ' \u00b7 Vorzeitraum ' + euro(alt.gesamt) +
          ' \u00b7 Ver\u00e4nderung ' + trend(jetzt.gesamt, alt.gesamt) + '</div>'
        : '');
  }

  function balken(name, wert, max) {
    var breite = max ? Math.max(2, wert / max * 100) : 2;
    return '<div class="balken"><div class="name">' + txt(name) + '</div>' +
      '<div class="spur"><div class="fuellung" style="width:' + breite.toFixed(1) + '%"></div></div>' +
      '<div class="wert">' + euro(wert) + '</div></div>';
  }

  function meldeAuswertung(text, art) {
    el('auswertung-meldung').innerHTML = text ? '<div class="meldung ' + art + '">' + txt(text) + '</div>' : '';
  }

        ['Erfasste Tage / \u00d8 pro Tag', b.jetzt.tage + ' / ' +

        ['Warenwert bestellt', euroText(b.ware.gesamt)],

        ['Personalquote', quote.toFixed(1).replace('.', ',') + ' %'],

      ],

      .sort(function (x, y) { return (b.jetzt.proFiliale[y] || 0) - (b.jetzt.proFiliale[x] || 0); });

    doc.autoTable({

      head: [['Filiale', 'Umsatz', 'Personal', 'Quote', 'Fixkosten', 'Ergebnis']],
      body: orte.map(function (ort) {
        var u = b.jetzt.proFiliale[ort] || 0;
        var l = b.erg.lohn.proFiliale[ort] || 0;
        var f = b.erg.fix.proFiliale[ort] || 0;
        return [ort, euroText(u), euroText(l),
          u ? (l / u * 100).toFixed(1).replace('.', ',') + ' %' : '-',
          euroText(f), euroText(u - l - f)];
      }),
      styles: { font: 'helvetica', fontSize: 9, cellPadding: 4 },
      headStyles: { fillColor: [46, 42, 121], textColor: 255 },
      columnStyles: { 1: { halign: 'right' }, 2: { halign: 'right' }, 3: { halign: 'right' },
                      4: { halign: 'right' }, 5: { halign: 'right', fontStyle: 'bold' } },
      margin: { left: 40, right: 40 }
    });

    var tage = Object.keys(aTage).filter(function (t) {
      return t >= aZeitraum.von && t <= aZeitraum.bis;
    }).sort();
    if (tage.length) {
      doc.autoTable({
        startY: doc.lastAutoTable.finalY + 22,
        head: [['Tag', 'Umsatz']],
        body: tage.map(function (tag) {
          var werte = aTage[tag] || {};
          var summe = Object.keys(werte).reduce(function (s, o) { return s + (Number(werte[o]) || 0); }, 0);
          return [tagText(tag), euroText(summe)];
        }),
        styles: { font: 'helvetica', fontSize: 9, cellPadding: 3.5 },
        headStyles: { fillColor: [46, 42, 121], textColor: 255 },
        columnStyles: { 1: { halign: 'right' } },
        margin: { left: 40, right: 40 }
      });
    }

    doc.save('Auswertung_' + aZeitraum.von + '_bis_' + aZeitraum.bis + '.pdf');
  });

  function euroText(n) { return (Number(n) || 0).toFixed(2).replace('.', ',') + ' EUR'; }
  function entziffert(text) { return String(text).replace(/[^\x20-\x7E\u00C0-\u017F]/g, ''); }

  el('d-pdf').addEventListener('click', function () {

    doc.setFont('helvetica', 'bold'); doc.setFontSize(16);

    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90, 90, 90);
    doc.text(tagText(montag) + ' bis ' + tagText(tagPlus(montag, 6)), 40, 62);

      startY: 78,

          stunden += stundenAusEintrag(code);
          var s = schichtZu(code);
          return s ? s.code + ' ' + s.von + '-' + s.bis
                   : (code === 'U' ? 'Urlaub' : code === 'K' ? 'Krank' : code);
        });
        gesamt += stunden;
        return [m.name + (m.filiale !== ort ? ' (V)' : '')].concat(spalten)
          .concat([stunden.toFixed(1).replace('.', ',') + ' h']);
      }),
      styles: { font: 'helvetica', fontSize: 9, cellPadding: 4 },

             40, doc.lastAutoTable.finalY + 20);
    doc.save('Dienstplan_' + ort.replace(/[^\w]+/g, '_') + '_KW' + kalenderwoche(montag) + '.pdf');
  });

  function csvSpeichern(zeilen, name) {
    var feld = function (w) {
      var s = String(w);
      return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    var csv = '\ufeff' + zeilen.map(function (r) { return r.map(feld).join(';'); }).join('\r\n') + '\r\n';
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }

          var u = Number(aTage[tag][ort]) || 0;
          var w = ware[tag + '|' + ort] || 0;
          zeilen.push([tagText(tag), ort, u.toFixed(2).replace('.', ','),

    zeilen.push([]);
    zeilen.push(['Gesamt', jetzt.gesamt.toFixed(2).replace('.', ','), '',
      ware.gesamt.toFixed(2).replace('.', ','),

      alt.gesamt.toFixed(2).replace('.', ','),
