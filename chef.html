    personalHolen().then(function () { meldePersonal('', ''); personalZeichnen(); });
  }

  // Was der Mitarbeiter den Betrieb pro Stunde wirklich kostet
  function vollkosten(m) {
    var lohn = Number(m.stundenlohn) || 0;
    var ag = m.agAnteil === undefined ? 21 : (Number(m.agAnteil) || 0);
    return lohn * (1 + ag / 100);
  }

  function personalZeichnen() {
    var ziel = el('personal-inhalt');
    if (!personal.length) {
      ziel.innerHTML = '<div class="leer">Noch keine Mitarbeiter angelegt.<br>' +
        '&Uuml;ber &bdquo;Mitarbeiter anlegen&ldquo; oben startest du.</div>';
      return;
    }
    var nachFiliale = {};
    personal.forEach(function (m) { (nachFiliale[m.filiale || 'Ohne Filiale'] = nachFiliale[m.filiale || 'Ohne Filiale'] || []).push(m); });

    ziel.innerHTML = Object.keys(nachFiliale).sort().map(function (ort) {
      var zeilen = nachFiliale[ort].sort(function (a, b) {
        return String(a.name).localeCompare(String(b.name), 'de');
      }).map(function (m) {
        var satz = vollkosten(m);
        var monat = (Number(m.wochenstunden) || 0) * 4.33 * satz;
        return '<tr>' +
          '<td>' + txt(m.personalnummer || '\u2013') + '</td>' +
          '<td><b>' + txt(m.name) + '</b>' +
            (m.aktiv === false ? ' <span style="color:var(--rot)">(ausgetreten)</span>' : '') +
            '<div class="aufteilung">' + txt(m.telefon || '') +
            (m.email ? ' \u00b7 ' + txt(m.email) : '') +
            (m.notiz ? ' \u00b7 ' + txt(m.notiz) : '') + '</div></td>' +
          '<td>' + txt(m.funktion || '') + '</td>' +
          '<td>' + txt(m.vertrag || '') + '</td>' +
          '<td class="zahl-rechts">' + (m.wochenstunden || 0) + ' h</td>' +
          '<td class="zahl-rechts">' + euro(Number(m.stundenlohn) || 0) + '</td>' +
          '<td class="zahl-rechts">' + (m.agAnteil === undefined ? 21 : m.agAnteil) + '&nbsp;%</td>' +
          '<td class="zahl-rechts"><b>' + euro(satz) + '</b></td>' +
          '<td class="zahl-rechts">' + euro(monat) + '</td>' +
          '<td class="zahl-rechts">' + (m.eintritt ? tagText(m.eintritt) : '\u2013') + '</td>' +
          '<td class="zahl-rechts">' +
            '<button class="zeilenknopf" data-bearbeiten="' + txt(m.id) + '">&Auml;ndern</button>' +
            '<button class="zeilenknopf loeschen" data-loeschen="' + txt(m.id) + '">L&ouml;schen</button></td>' +
        '</tr>';
      }).join('');
      return '<h3 class="abschnitt">' + txt(ort) + ' \u00b7 ' + nachFiliale[ort].length + ' Mitarbeiter</h3>' +
        '<div class="rollen"><table><thead><tr><th>Pers.-Nr.</th><th>Name</th><th>Funktion</th><th>Vertrag</th>' +
        '<th class="zahl-rechts">Woche</th><th class="zahl-rechts">Lohn/h</th>' +
        '<th class="zahl-rechts">AG-Anteil</th><th class="zahl-rechts">Kosten/h</th>' +
        '<th class="zahl-rechts">Kosten/Monat</th><th class="zahl-rechts">Eintritt</th>' +
        '<th></th></tr></thead><tbody>' + zeilen + '</tbody></table></div>';
    }).join('');

    ziel.querySelectorAll('[data-bearbeiten]').forEach(function (b) {
      b.addEventListener('click', function () { personalFormular(b.dataset.bearbeiten); });
    });
    ziel.querySelectorAll('[data-loeschen]').forEach(function (b) {
      b.addEventListener('click', function () {
        var m = personal.filter(function (x) { return x.id === b.dataset.loeschen; })[0];
        if (!m || !confirm('„' + m.name + '“ wirklich löschen?')) return;
        personal = personal.filter(function (x) { return x.id !== b.dataset.loeschen; });
        personalSpeichern();
      });
    });
  }

  el('p-neu').addEventListener('click', function () { personalFormular(null); });

  function personalFormular(id) {
    var m = personal.filter(function (x) { return x.id === id; })[0] ||
      { id: '', personalnummer: '', name: '', filiale: alleFilialen[0] || '', funktion: 'Verkauf', vertrag: 'Teilzeit',
        wochenstunden: '', stundenlohn: '', agAnteil: 21, eintritt: '', austritt: '',
        telefon: '', email: '', notiz: '', aktiv: true };

    function auswahl(id, wert, liste) {
      return '<select class="klein" id="' + id + '">' + liste.map(function (w) {
        return '<option' + (w === wert ? ' selected' : '') + '>' + txt(w) + '</option>';
      }).join('') + '</select>';
    }
    function feld(id, name, wert, typ) {
      return '<div class="formularfeld"><label class="feldname" for="' + id + '">' + name + '</label>' +
        '<input class="klein" type="' + (typ || 'text') + '" id="' + id + '" value="' + txt(wert || '') + '"></div>';
    }

    el('personal-formular').classList.remove('verstecken');
    el('personal-formular').innerHTML =
      '<div style="border:1px solid var(--linie);border-radius:11px;padding:14px;margin-bottom:16px">' +
      '<h3 class="abschnitt" style="margin-top:0">' + (id ? 'Mitarbeiter &auml;ndern' : 'Neuer Mitarbeiter') + '</h3>' +
      '<div class="raster">' +
        feld('f-nummer', 'Personalnummer', m.personalnummer) +
        feld('f-name', 'Name', m.name) +
        '<div class="formularfeld"><label class="feldname">Stammfiliale</label>' +
          auswahl('f-filiale', m.filiale, alleFilialen) + '</div>' +
        '<div class="formularfeld"><label class="feldname">Funktion</label>' +
          auswahl('f-funktion', m.funktion, FUNKTIONEN) + '</div>' +
        '<div class="formularfeld"><label class="feldname">Vertrag</label>' +
          auswahl('f-vertrag', m.vertrag, VERTRAEGE) + '</div>' +
        feld('f-stunden', 'Wochenstunden', m.wochenstunden) +
        feld('f-lohn', 'Stundenlohn €', m.stundenlohn) +
        feld('f-ag', 'Arbeitgeberanteil %', m.agAnteil === undefined ? 21 : m.agAnteil) +
        feld('f-eintritt', 'Eintritt', m.eintritt, 'date') +
        feld('f-austritt', 'Austritt', m.austritt, 'date') +
        feld('f-telefon', 'Telefon', m.telefon) +
        feld('f-email', 'E-Mail', m.email) +
        feld('f-notiz', 'Notiz', m.notiz) +
      '</div>' +
      '<div class="werkzeuge" style="margin-top:6px">' +
        '<button type="button" id="f-sichern">Speichern</button>' +
        '<button type="button" id="f-abbruch">Abbrechen</button></div></div>';

    el('f-abbruch').addEventListener('click', function () {
      el('personal-formular').classList.add('verstecken');
      el('personal-formular').innerHTML = '';
    });
    el('f-sichern').addEventListener('click', function () {
      var name = el('f-name').value.trim();
      if (!name) { meldePersonal('Bitte einen Namen eintragen.', 'fehler'); return; }
      var neu = {
        id: id || 'm' + Date.now(),
        personalnummer: el('f-nummer').value.trim(),
        name: name,
        filiale: el('f-filiale').value,
        funktion: el('f-funktion').value,
        vertrag: el('f-vertrag').value,
        wochenstunden: betrag(el('f-stunden').value),
        stundenlohn: betrag(el('f-lohn').value),
        agAnteil: el('f-ag').value.trim() === '' ? 21 : betrag(el('f-ag').value),
        eintritt: el('f-eintritt').value,
        austritt: el('f-austritt').value,
        telefon: el('f-telefon').value.trim(),
        email: el('f-email').value.trim(),
        notiz: el('f-notiz').value.trim(),
        aktiv: !el('f-austritt').value
      };
      if (id) personal = personal.map(function (x) { return x.id === id ? neu : x; });
      else personal.push(neu);
      el('personal-formular').classList.add('verstecken');
      el('personal-formular').innerHTML = '';
      personalSpeichern();
    });
  }

  function personalSpeichern() {
    personalZeichnen();
    meldePersonal('Wird gespeichert \u2026', 'ladend');
    ablageSchreiben('personal', 'alle', { mitarbeiter: personal })
      .then(function () {
        meldePersonal('Gespeichert.', 'gut');
        setTimeout(function () { meldePersonal('', ''); }, 2500);
      })
      .catch(function () {
        meldePersonal('Der Server speichert noch nicht. Die Daten liegen vorerst nur auf diesem Gerät.', 'fehler');
      });
  }

  el('p-csv').addEventListener('click', function () {
    var zeilen = [['Personalnummer', 'Name', 'Stammfiliale', 'Funktion', 'Vertrag', 'Wochenstunden',
                   'Stundenlohn', 'Arbeitgeberanteil %', 'Kosten pro Stunde', 'Kosten pro Monat',
                   'Eintritt', 'Austritt', 'Telefon', 'E-Mail', 'Notiz']];
    personal.forEach(function (m) {
      var satz = vollkosten(m);
      var monat = (Number(m.wochenstunden) || 0) * 4.33 * satz;
      zeilen.push([m.personalnummer || '', m.name, m.filiale, m.funktion, m.vertrag,
        String(m.wochenstunden || ''), String(m.stundenlohn || '').replace('.', ','),
        String(m.agAnteil === undefined ? 21 : m.agAnteil).replace('.', ','),
        satz.toFixed(2).replace('.', ','), monat.toFixed(2).replace('.', ','),
        m.eintritt || '', m.austritt || '', m.telefon || '', m.email || '', m.notiz || '']);
    });
    csvSpeichern(zeilen, 'Personalliste.csv');
  });

  function meldePersonal(text, art) {
    el('personal-meldung').innerHTML = text ? '<div class="meldung ' + art + '">' + txt(text) + '</div>' : '';
  }

  // ---------- Dienstplan ----------
  var WOCHENTAGE = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
  var TAGNAMEN = { Mo: 'Montag', Di: 'Dienstag', Mi: 'Mittwoch', Do: 'Donnerstag',
                   Fr: 'Freitag', Sa: 'Samstag', So: 'Sonntag' };

  var SCHICHT_STANDARD = [
    { code: 'F', name: 'Fr\u00fchschicht',  von: '05:00', bis: '13:00', farbe: '#2E2A79' },
    { code: 'M', name: 'Mittelschicht',     von: '09:00', bis: '16:00', farbe: '#1E7B45' },
    { code: 'S', name: 'Sp\u00e4tschicht',  von: '12:00', bis: '19:30', farbe: '#B36B00' }
  ];
  var ABWESEND = [
    { code: 'U', name: 'Urlaub' },
    { code: 'K', name: 'Krank' }
  ];

  var schichten = JSON.parse(JSON.stringify(SCHICHT_STANDARD));
  var dienstplanAnsicht = 'plan';

  el('d-tag').value = heute.toISOString().slice(0, 10);
  el('d-tag').addEventListener('change', dienstplanLaden);
  el('d-filiale').addEventListener('change', dienstplanZeichnen);

  ['plan', 'kalender', 'zeiten'].forEach(function (name) {
    el('d-ansicht-' + name).addEventListener('click', function () {
      dienstplanAnsicht = name;
      ['plan', 'kalender', 'zeiten'].forEach(function (n) {
        el('d-ansicht-' + n).classList.toggle('an', n === name);
      });
      el('dienstplan-zeiten').classList.toggle('verstecken', name !== 'zeiten');
      el('dienstplan-inhalt').classList.toggle('verstecken', name === 'zeiten');
      if (name === 'zeiten') zeitenZeichnen(); else dienstplanZeichnen();
    });
  });

  function dienstplanLaden() {
    if (!el('d-filiale').options.length) {
      alleFilialen.forEach(function (ort) {
        var o = document.createElement('option');
        o.value = ort; o.textContent = ort; el('d-filiale').appendChild(o);
      });
    }
    var woche = wochenSchluessel(el('d-tag').value || heute.toISOString().slice(0, 10));
    meldeDienstplan('Dienstplan wird geladen \u2026', 'ladend');
    Promise.all([
      personalHolen(),
      ablageLesen('dienstplan', woche, { plan: {} }),
      ablageLesen('dienstplan', 'schichten', { schichten: SCHICHT_STANDARD })
    ]).then(function (e) {
      dienstplaene[woche] = e[1].plan || {};
      if (e[2] && e[2].schichten && e[2].schichten.length) schichten = e[2].schichten;
      meldeDienstplan('', '');
      if (dienstplanAnsicht === 'zeiten') zeitenZeichnen(); else dienstplanZeichnen();
    });
  }

  function schichtZu(code) {
    return schichten.filter(function (s) { return s.code === code; })[0] || null;
  }

  // Stunden aus einem Eintrag: Schichtkürzel, Urlaub/Krank oder freie Zeitangabe
  function stundenAusEintrag(roh) {
    var wert = (roh && typeof roh === 'object') ? (roh.s || '') : roh;
    if (!wert) return 0;
    var s = schichtZu(wert);
    if (s) return stundenAusText(s.von + '-' + s.bis);
    if (wert === 'U' || wert === 'K') return 0;
    return stundenAusText(wert);
  }

  function eintragText(roh) {
    var wert = (roh && typeof roh === 'object') ? (roh.s || '') : roh;
    if (!wert) return '';
    var s = schichtZu(wert);
    if (s) return s.name + ' ' + s.von + '\u2013' + s.bis;
    if (wert === 'U') return 'Urlaub';
    if (wert === 'K') return 'Krank';
    return wert;
  }

  function stundenAusText(text) {
    var t = String(text || '').replace(/\s/g, '').replace(/[\u2013\u2014]/g, '-');
    var m = t.match(/^(\d{1,2})[:.]?(\d{2})?-(\d{1,2})[:.]?(\d{2})?$/);
    if (!m) return 0;
    var von = (+m[1]) + (m[2] ? +m[2] / 60 : 0);
    var bis = (+m[3]) + (m[4] ? +m[4] / 60 : 0);
    if (bis <= von) return 0;
    var dauer = bis - von;
    return dauer > 6 ? dauer - 0.5 : dauer;   // ab 6 Stunden 30 Minuten Pause
  }

  // ---------- Einträge lesen ----------
  // Ein Eintrag ist entweder "F" (eigene Filiale) oder {s:"F", f:"Landstuhl"} bei Vertretung
  function eintragCode(e) { return !e ? '' : (typeof e === 'string' ? e : (e.s || '')); }
  function eintragOrt(e, m) {
    if (e && typeof e === 'object' && e.f) return e.f;
    return m ? m.filiale : '';
  }

  // ---------- Schichtzeiten pflegen ----------
  function zeitenZeichnen() {
    el('dienstplan-zeiten').innerHTML =
      '<h3 class="abschnitt" style="margin-top:0">Schichtzeiten</h3>' +
      '<div class="aufteilung" style="margin-bottom:12px">Gelten f\u00fcr alle Filialen. ' +
      'Ab sechs Stunden wird eine halbe Stunde Pause abgezogen.</div>' +
      '<div class="rollen"><table><thead><tr><th>Schicht</th><th>K\u00fcrzel</th>' +
      '<th>Beginn</th><th>Ende</th><th class="zahl-rechts">Stunden</th></tr></thead><tbody>' +
      schichten.map(function (s, i) {
        return '<tr><td><input class="klein" type="text" data-schicht="' + i + '" data-teil="name" value="' +
            txt(s.name) + '"></td>' +
          '<td><b style="color:' + txt(s.farbe || '#2E2A79') + '">' + txt(s.code) + '</b></td>' +
          '<td><input class="klein" type="time" data-schicht="' + i + '" data-teil="von" value="' + txt(s.von) + '"></td>' +
          '<td><input class="klein" type="time" data-schicht="' + i + '" data-teil="bis" value="' + txt(s.bis) + '"></td>' +
          '<td class="zahl-rechts">' + stundenAusText(s.von + '-' + s.bis).toFixed(1).replace('.', ',') + ' h</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="werkzeuge" style="margin-top:12px">' +
        '<button type="button" id="z-sichern">Schichtzeiten speichern</button></div>';

    el('dienstplan-zeiten').querySelectorAll('[data-schicht]').forEach(function (feld) {
      feld.addEventListener('change', function () {
        schichten[+feld.dataset.schicht][feld.dataset.teil] = feld.value;
        zeitenZeichnen();
      });
    });
    el('z-sichern').addEventListener('click', function () {
      meldeDienstplan('Wird gespeichert \u2026', 'ladend');
      ablageSchreiben('dienstplan', 'schichten', { schichten: schichten })
        .then(function () {
          meldeDienstplan('Schichtzeiten gespeichert.', 'gut');
          setTimeout(function () { meldeDienstplan('', ''); }, 2500);
        })
        .catch(function () {
          meldeDienstplan('Der Server speichert noch nicht. Die Zeiten liegen vorerst nur auf diesem Ger\u00e4t.', 'fehler');
        });
    });
  }

  // ---------- Wer arbeitet diese Woche in dieser Filiale ----------
  var vertretungen = {};   // "2026-W35|Landstuhl" -> [Mitarbeiter-IDs]

  function vertretungsListe(woche, ort) {
    return vertretungen[woche + '|' + ort] || [];
  }

  function besetzung(woche, ort) {
    var plan = dienstplaene[woche] || {};
    var eigene = personal.filter(function (m) { return m.filiale === ort && m.aktiv !== false; });
    var fremde = personal.filter(function (m) {
      if (m.filiale === ort || m.aktiv === false) return false;
      if (vertretungsListe(woche, ort).indexOf(m.id) > -1) return true;
      var eintrag = plan[m.id] || {};
      return WOCHENTAGE.some(function (tag) { return eintragOrt(eintrag[tag], m) === ort; });
    });
    return { eigene: eigene, fremde: fremde, alle: eigene.concat(fremde) };
  }

  // ---------- Plan eintragen ----------
  function dienstplanZeichnen() {
    if (dienstplanAnsicht === 'kalender') { kalenderZeichnen(); return; }

    var woche = wochenSchluessel(el('d-tag').value);
    var montag = montagVon(el('d-tag').value);
    var ort = el('d-filiale').value;
    var plan = dienstplaene[woche] || {};
    var wer = besetzung(woche, ort);

    if (!wer.alle.length) {
      el('dienstplan-inhalt').innerHTML = '<div class="leer">F&uuml;r ' + txt(ort) +
        ' sind keine Mitarbeiter angelegt.<br>Im Reiter Personal anlegen oder unten eine Vertretung holen.</div>' +
        vertretungsFeld(woche, ort);
      vertretungKnopf(woche, ort);
      return;
    }

    var auswahlFelder = function (wert) {
      var teile = ['<option value="">frei</option>'];
      schichten.forEach(function (s) {
        teile.push('<option value="' + txt(s.code) + '"' + (wert === s.code ? ' selected' : '') + '>' +
          txt(s.name) + ' (' + txt(s.von) + ')</option>');
      });
      ABWESEND.forEach(function (a) {
        teile.push('<option value="' + a.code + '"' + (wert === a.code ? ' selected' : '') + '>' + a.name + '</option>');
      });
      var eigen = wert && !schichtZu(wert) && wert !== 'U' && wert !== 'K';
      teile.push('<option value="eigen"' + (eigen ? ' selected' : '') + '>eigene Zeit \u2026</option>');
      return teile.join('');
    };

    var gesamtStunden = 0, gesamtKosten = 0;
    var zeilen = wer.alle.map(function (m) {
      var eintrag = plan[m.id] || {};
      var fremd = m.filiale !== ort;
      var stunden = 0;
      var felder = WOCHENTAGE.map(function (tag) {
        var roh = eintrag[tag];
        var code = eintragCode(roh);
        var einsatzOrt = eintragOrt(roh, m);

        // Woanders eingeteilt: hier nur anzeigen, nicht mitrechnen
        if (code && einsatzOrt !== ort) {
          return '<td><div class="aufteilung" style="color:var(--rot)">\u2192 ' + txt(einsatzOrt) + '<br>' +
            txt(kurzText(code)) + '</div>' +
            '<select class="klein" style="margin-top:4px" data-person="' + txt(m.id) + '" data-tag="' + tag + '">' +
            auswahlFelder('') + '</select></td>';
        }
        if (code) stunden += stundenAusEintrag(code);
        var eigen = code && !schichtZu(code) && code !== 'U' && code !== 'K';
        return '<td><select class="klein" data-person="' + txt(m.id) + '" data-tag="' + tag + '">' +
          auswahlFelder(code) + '</select>' +
          (eigen ? '<input class="klein" style="margin-top:4px" type="text" data-eigen="' + txt(m.id) +
            '" data-tag="' + tag + '" value="' + txt(code) + '" placeholder="6-14">' : '') + '</td>';
      }).join('');
      var lohnkosten = stunden * vollkosten(m);
      gesamtStunden += stunden; gesamtKosten += lohnkosten;
      return '<tr><td><b>' + txt(m.name) + '</b>' +
        (fremd ? ' <span style="color:var(--gruen);font-size:12px;font-weight:600">Vertretung</span>' : '') +
        '<div class="aufteilung">' + txt(m.funktion || '') +
        (fremd ? ' \u00b7 aus ' + txt(m.filiale) : ' \u00b7 ' + (m.wochenstunden || 0) + ' h vertraglich') +
        ' \u00b7 ' + euro(vollkosten(m)) + '/h</div></td>' + felder +
        '<td class="zahl-rechts"><b>' + stunden.toFixed(1).replace('.', ',') + ' h</b></td>' +
        '<td class="zahl-rechts">' + euro(lohnkosten) + '</td></tr>';
    }).join('');

    el('dienstplan-inhalt').innerHTML =
      '<h3 class="abschnitt" style="margin-top:0">' + txt(ort) + ' \u00b7 KW ' + kalenderwoche(montag) +
        ' \u00b7 ' + tagText(montag) + ' bis ' + tagText(tagPlus(montag, 6)) + '</h3>' +
      '<div class="rollen"><table><thead><tr><th>Mitarbeiter</th>' +
      WOCHENTAGE.map(function (t, i) {
        return '<th>' + t + '<div class="aufteilung">' + tagPlus(montag, i).slice(8) + '.' +
          tagPlus(montag, i).slice(5, 7) + '.</div></th>';
      }).join('') +
      '<th class="zahl-rechts">Stunden</th><th class="zahl-rechts">Kosten</th></tr></thead>' +
      '<tbody>' + zeilen + '</tbody></table></div>' +
      '<div style="margin-top:14px;font-weight:600">' + gesamtStunden.toFixed(1).replace('.', ',') +
        ' Stunden \u00b7 Personalkosten ' + euro(gesamtKosten) + '</div>' +
      vertretungsFeld(woche, ort);

    el('dienstplan-inhalt').querySelectorAll('select[data-person]').forEach(function (feld) {
      feld.addEventListener('change', function () {
        setzeSchicht(feld.dataset.person, feld.dataset.tag,
                     feld.value === 'eigen' ? '6-14' : feld.value);
      });
    });
    el('dienstplan-inhalt').querySelectorAll('input[data-eigen]').forEach(function (feld) {
      feld.addEventListener('change', function () {
        setzeSchicht(feld.dataset.eigen, feld.dataset.tag, feld.value.trim());
      });
    });
    vertretungKnopf(woche, ort);
  }

  function kurzText(code) {
    var s = schichtZu(code);
    if (s) return s.name;
    if (code === 'U') return 'Urlaub';
    if (code === 'K') return 'Krank';
    return code;
  }

  function vertretungsFeld(woche, ort) {
    var andere = personal.filter(function (m) { return m.filiale !== ort && m.aktiv !== false; })
      .sort(function (a, b) { return String(a.filiale).localeCompare(String(b.filiale), 'de'); });
    if (!andere.length) return '';
    return '<div style="border:1px solid var(--linie);border-radius:11px;padding:12px;margin-top:16px">' +
      '<label class="feldname" for="v-person">Vertretung aus einer anderen Filiale holen</label>' +
      '<div class="raster">' +
        '<div style="flex:1 1 220px"><select class="klein" id="v-person">' +
          andere.map(function (m) {
            return '<option value="' + txt(m.id) + '">' + txt(m.name) + ' \u2013 ' + txt(m.filiale) +
              ' (' + txt(m.funktion || '') + ')</option>';
          }).join('') + '</select></div>' +
        '<div style="flex:0 0 auto"><button type="button" class="zeilenknopf" id="v-holen" ' +
          'style="padding:9px 14px;font-size:14px">In den Plan aufnehmen</button></div>' +
      '</div>' +
      '<div class="aufteilung" style="margin-top:6px">Die Person erscheint als Zeile im Plan. ' +
      'Stunden und Kosten z\u00e4hlen dann zu ' + txt(ort) + ', nicht zur Stammfiliale.</div></div>';
  }

  function vertretungKnopf(woche, ort) {
    var knopf = el('v-holen');
    if (!knopf) return;
    knopf.addEventListener('click', function () {
      var id = el('v-person').value;
      var schluessel = woche + '|' + ort;
      vertretungen[schluessel] = vertretungen[schluessel] || [];
      if (vertretungen[schluessel].indexOf(id) === -1) vertretungen[schluessel].push(id);
      dienstplanZeichnen();
    });
  }

  function setzeSchicht(personId, tag, wert) {
    var w = wochenSchluessel(el('d-tag').value);
    var ort = el('d-filiale').value;
    var m = personal.filter(function (x) { return x.id === personId; })[0];
    dienstplaene[w] = dienstplaene[w] || {};
    var eintrag = dienstplaene[w][personId] || {};
    if (!wert) delete eintrag[tag];
    else if (m && m.filiale === ort) eintrag[tag] = wert;         // eigene Filiale
    else eintrag[tag] = { s: wert, f: ort };                       // Vertretung
    dienstplaene[w][personId] = eintrag;
    dienstplanZeichnen();
  }

  // ---------- Wochenkalender ----------
  function kalenderZeichnen() {
    var woche = wochenSchluessel(el('d-tag').value);
    var montag = montagVon(el('d-tag').value);
    var ort = el('d-filiale').value;
    var plan = dienstplaene[woche] || {};
    var wer = besetzung(woche, ort);

    if (!wer.alle.length) {
      el('dienstplan-inhalt').innerHTML = '<div class="leer">F&uuml;r ' + txt(ort) +
        ' sind keine Mitarbeiter angelegt.</div>';
      return;
    }

    // Wer arbeitet an diesem Tag in dieser Filiale?
    function hierAmTag(tag, code) {
      return wer.alle.filter(function (m) {
        var roh = (plan[m.id] || {})[tag];
        if (eintragOrt(roh, m) !== ort) return false;
        return code ? eintragCode(roh) === code : !!eintragCode(roh);
      });
    }
    function name(m) {
      return txt(m.name) + (m.filiale !== ort ? ' <span style="color:var(--gruen)">(V)</span>' : '');
    }

    var tage = WOCHENTAGE.map(function (tag, i) {
      var datum = tagPlus(montag, i);
      var bloecke = schichten.map(function (s) {
        return { titel: s.name + ' ' + s.von + '\u2013' + s.bis, farbe: s.farbe || '#2E2A79',
                 namen: hierAmTag(tag, s.code) };
      });
      var eigene = hierAmTag(tag, null).filter(function (m) {
        var code = eintragCode((plan[m.id] || {})[tag]);
        return code && !schichtZu(code) && code !== 'U' && code !== 'K';
      });
      if (eigene.length) bloecke.push({ titel: 'Sonderzeiten', farbe: '#6B6880', namen: eigene, zeigeZeit: true });

      var abwesend = wer.eigene.filter(function (m) {
        var code = eintragCode((plan[m.id] || {})[tag]);
        return code === 'U' || code === 'K';
      });
      var ausgeliehen = wer.eigene.filter(function (m) {
        var roh = (plan[m.id] || {})[tag];
        return eintragCode(roh) && eintragOrt(roh, m) !== ort;
      });

      var stunden = 0, kosten = 0;
      hierAmTag(tag, null).forEach(function (m) {
        var h = stundenAusEintrag(eintragCode((plan[m.id] || {})[tag]));
        stunden += h; kosten += h * vollkosten(m);
      });

      return '<div style="border:1px solid var(--linie);border-radius:11px;padding:12px;margin-bottom:10px">' +
        '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px">' +
          '<b style="font-family:Nunito,sans-serif;font-size:15px">' + TAGNAMEN[tag] + '</b>' +
          '<span class="aufteilung">' + tagText(datum) + '</span>' +
          '<span style="margin-left:auto;font-size:12px;font-weight:600">' +
            stunden.toFixed(1).replace('.', ',') + ' h \u00b7 ' + euro(kosten) + '</span></div>' +
        bloecke.map(function (b) {
          return '<div style="display:flex;gap:9px;margin-bottom:6px;font-size:13px">' +
            '<span style="flex:0 0 6px;border-radius:3px;background:' + b.farbe + '"></span>' +
            '<span style="flex:0 0 118px;color:var(--grau)">' + txt(b.titel) + '</span>' +
            '<span style="flex:1">' + (b.namen.length
              ? b.namen.map(function (m) {
                  return name(m) + (b.zeigeZeit ? ' (' + txt(eintragCode((plan[m.id] || {})[tag])) + ')' : '');
                }).join(', ')
              : '<span style="color:var(--rot)">nicht besetzt</span>') + '</span></div>';
        }).join('') +
        (abwesend.length ? '<div class="aufteilung" style="margin-top:8px">Abwesend: ' +
          abwesend.map(function (m) {
            return txt(m.name) + ' (' + kurzText(eintragCode((plan[m.id] || {})[tag])) + ')';
          }).join(', ') + '</div>' : '') +
        (ausgeliehen.length ? '<div class="aufteilung">Aushilfe in anderer Filiale: ' +
          ausgeliehen.map(function (m) {
            return txt(m.name) + ' \u2192 ' + txt(eintragOrt((plan[m.id] || {})[tag], m));
          }).join(', ') + '</div>' : '') +
      '</div>';
    }).join('');

    var summeStunden = 0, summeKosten = 0;
    WOCHENTAGE.forEach(function (tag) {
      hierAmTag(tag, null).forEach(function (m) {
        var h = stundenAusEintrag(eintragCode((plan[m.id] || {})[tag]));
        summeStunden += h; summeKosten += h * vollkosten(m);
      });
    });

    el('dienstplan-inhalt').innerHTML =
      '<h3 class="abschnitt" style="margin-top:0">' + txt(ort) + ' \u00b7 KW ' + kalenderwoche(montag) +
        ' \u00b7 ' + tagText(montag) + ' bis ' + tagText(tagPlus(montag, 6)) + '</h3>' +
      tage +
      '<div style="margin-top:6px;font-weight:600">Woche gesamt: ' +
        summeStunden.toFixed(1).replace('.', ',') + ' Stunden \u00b7 ' + euro(summeKosten) + '</div>' +
      '<div class="aufteilung">(V) = Vertretung aus einer anderen Filiale</div>';
  }

  el('d-speichern').addEventListener('click', function () {
    var woche = wochenSchluessel(el('d-tag').value);
    meldeDienstplan('Wird gespeichert \u2026', 'ladend');
    ablageSchreiben('dienstplan', woche, { plan: dienstplaene[woche] || {} })
      .then(function () {
        meldeDienstplan('Dienstplan f\u00fcr ' + woche.replace('-W', ', KW ') + ' gespeichert.', 'gut');
        setTimeout(function () { meldeDienstplan('', ''); }, 2500);
      })
      .catch(function () {
        meldeDienstplan('Der Server speichert noch nicht. Der Plan liegt vorerst nur auf diesem Ger\u00e4t.', 'fehler');
      });
  });

  function meldeDienstplan(text, art) {
    el('dienstplan-meldung').innerHTML = text ? '<div class="meldung ' + art + '">' + txt(text) + '</div>' : '';
  }

  // ---------- Kosten je Filiale ----------
  function kostenHolen() {
    if (Object.keys(kosten).length) return Promise.resolve(kosten);
    return ablageLesen('kosten', 'alle', { filialen: {} }).then(function (d) {
      kosten = d.filialen || {};
      return kosten;
    });
  }

  function kostenLaden() {
    meldeKosten('Kosten werden geladen \u2026', 'ladend');
    kosten = {};
    Promise.all([personalHolen(), kostenHolen()]).then(function () {
      meldeKosten('', ''); kostenZeichnen();
    });
  }

  function personalkostenVertraglichProMonat(ort) {
    return personal.filter(function (m) { return m.filiale === ort && m.aktiv !== false; })
      .reduce(function (s, m) {
        return s + (Number(m.wochenstunden) || 0) * 4.33 * vollkosten(m);
      }, 0);
  }

  function kostenZeichnen() {
    var summeGesamt = 0;
    var zeilen = alleFilialen.map(function (ort) {
      var k = kosten[ort] || {};
      var lohn = personalkostenVertraglichProMonat(ort);
      var pauschal = Number(k.pauschal) || 0;
      var gesamt = monatskosten(ort);
      summeGesamt += gesamt;
      var feld = function (name, wert, klasse) {
        return '<td class="zahl-rechts"><input class="geld' + (klasse || '') + '" type="text" inputmode="decimal" ' +
          'data-ort="' + txt(ort) + '" data-art="' + name + '" value="' +
          (wert ? Number(wert).toFixed(2).replace('.', ',') : '') + '" placeholder="0,00"></td>';
      };
      return '<tr><td>' + txt(ort) + '</td>' +
        feld('pauschal', k.pauschal) +
        feld('miete', k.miete) + feld('energie', k.energie) + feld('sonstiges', k.sonstiges) +
        '<td class="zahl-rechts">' + euro(lohn) + '</td>' +
        '<td class="zahl-rechts"><b>' + euro(gesamt) + '</b>' +
          (pauschal ? '<div class="aufteilung">Pauschale gilt</div>' : '') + '</td></tr>';
    }).join('');

    el('kosten-inhalt').innerHTML =
      '<div class="rollen"><table><thead><tr><th>Filiale</th>' +
      '<th class="zahl-rechts">Gesamt pauschal</th>' +
      '<th class="zahl-rechts">Miete/Monat</th><th class="zahl-rechts">Energie/Monat</th>' +
      '<th class="zahl-rechts">Sonstiges/Monat</th><th class="zahl-rechts">Personal/Monat</th>' +
      '<th class="zahl-rechts">Gilt pro Monat</th></tr></thead><tbody>' + zeilen + '</tbody></table></div>' +
      '<div style="margin-top:14px;font-weight:600">Gesamtkosten aller Filialen: ' +
        euro(summeGesamt) + ' pro Monat</div>' +
      '<div class="aufteilung">Tr\u00e4gt der Chef eine Pauschale ein, rechnet die Software nur mit ihr. ' +
      'Bleibt das Feld leer, werden Miete, Energie, Sonstiges und Personal addiert.</div>';

    el('kosten-inhalt').querySelectorAll('input[data-ort]').forEach(function (feld) {
      feld.addEventListener('change', function () {
        var ort = feld.dataset.ort;
        kosten[ort] = kosten[ort] || {};
        kosten[ort][feld.dataset.art] = betrag(feld.value);
        kostenZeichnen();
      });
    });
  }

  el('k-speichern').addEventListener('click', function () {
    meldeKosten('Wird gespeichert \u2026', 'ladend');
    ablageSchreiben('kosten', 'alle', { filialen: kosten })
      .then(function () {
        meldeKosten('Kosten gespeichert.', 'gut');
        setTimeout(function () { meldeKosten('', ''); }, 2500);
      })
      .catch(function () {
        meldeKosten('Der Server speichert noch nicht. Die Kosten liegen vorerst nur auf diesem Gerät.', 'fehler');
      });
  });

  function meldeKosten(text, art) {
    el('kosten-meldung').innerHTML = text ? '<div class="meldung ' + art + '">' + txt(text) + '</div>' : '';
  }

  // ---------- Personalkosten im Zeitraum ----------
  function dienstplaeneHolen(z) {
    return fetch(ENDPUNKT_DATEN, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ aktion: 'liste', bereich: 'dienstplan' })
    })
    .then(function (a) { if (!a.ok) throw new Error('Status ' + a.status); return a.json(); })
    .then(function (d) {
      Object.keys(d.eintraege || {}).forEach(function (k) {
        dienstplaene[k] = (d.eintraege[k] || {}).plan || {};
      });
      return dienstplaene;
    })
    .catch(function () {
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var s = localStorage.key(i);
          if (s.indexOf('chef-dienstplan-') !== 0) continue;
          dienstplaene[s.slice(16)] = (JSON.parse(localStorage.getItem(s)) || {}).plan || {};
        }
      } catch (e) {}
      return dienstplaene;
    });
  }

  function personalkosten(z) {
    var proFiliale = {}, gesamt = 0, ausPlan = false;
    var person = {};
    personal.forEach(function (m) { person[m.id] = m; });

    Object.keys(dienstplaene).forEach(function (woche) {
      var t = woche.split('-W');
      var montag = montagAusWoche(parseInt(t[0], 10), parseInt(t[1], 10));
      if (!montag) return;
      WOCHENTAGE.forEach(function (tag, i) {
        var datum = tagPlus(montag, i);
        if (datum < z.von || datum > z.bis) return;
        Object.keys(dienstplaene[woche]).forEach(function (id) {
          var m = person[id]; if (!m) return;
          var roh = (dienstplaene[woche][id] || {})[tag];
          var stunden = stundenAusEintrag(roh);
          if (!stunden) return;
          var wert = stunden * vollkosten(m);
          var ort = eintragOrt(roh, m);   // Vertretung zählt zur Einsatzfiliale
          proFiliale[ort] = (proFiliale[ort] || 0) + wert;
          gesamt += wert; ausPlan = true;
        });
      });
    });

    if (ausPlan) return { proFiliale: proFiliale, gesamt: gesamt, quelle: 'Dienstpl\u00e4ne' };

    // ohne Dienstpläne: aus den Vertragsstunden hochgerechnet
    var tage = tageImZeitraum(z);
    personal.forEach(function (m) {
      if (m.aktiv === false) return;
      var proTag = (Number(m.wochenstunden) || 0) * vollkosten(m) / 7;
      proFiliale[m.filiale] = (proFiliale[m.filiale] || 0) + proTag * tage;
      gesamt += proTag * tage;
    });
    return { proFiliale: proFiliale, gesamt: gesamt, quelle: 'Vertragsstunden' };
  }

  function montagAusWoche(jahr, kw) {
    var d = new Date(jahr, 0, 4);
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + (kw - 1) * 7);
    return d.toISOString().slice(0, 10);
  }
  function tageImZeitraum(z) {
    return Math.round((new Date(z.bis + 'T12:00:00') - new Date(z.von + 'T12:00:00')) / 86400000) + 1;
  }
  function fixkosten(z) {
    var anteil = tageImZeitraum(z) / 30.44;
    var proFiliale = {}, gesamt = 0;
    Object.keys(kosten).forEach(function (ort) {
      var k = kosten[ort] || {};
      // Ohne Pauschale nur die Sachkosten, das Personal wird getrennt ausgewiesen
      var monat = Number(k.pauschal) > 0 ? Number(k.pauschal)
        : (Number(k.miete) || 0) + (Number(k.energie) || 0) + (Number(k.sonstiges) || 0);
      proFiliale[ort] = monat * anteil;
      gesamt += monat * anteil;
    });
    return { proFiliale: proFiliale, gesamt: gesamt };
  }

  function ergebnisBlock(jetzt) {
    var lohn = personalkosten(aZeitraum);
    var fix = fixkosten(aZeitraum);
    var orte = Object.keys(jetzt.proFiliale).concat(alleFilialen)
      .filter(function (o, i, l) { return l.indexOf(o) === i; })
      .sort(function (a, b) { return (jetzt.proFiliale[b] || 0) - (jetzt.proFiliale[a] || 0); });

    var zeilen = orte.map(function (ort) {
      var u = jetzt.proFiliale[ort] || 0;
      var l = lohn.proFiliale[ort] || 0;
      var f = fix.proFiliale[ort] || 0;
      var ergebnis = u - l - f;
      return '<tr><td>' + txt(ort) + '</td>' +
        '<td class="zahl-rechts">' + euro(u) + '</td>' +
        '<td class="zahl-rechts">' + euro(l) + '</td>' +
        '<td class="zahl-rechts">' + (u ? (l / u * 100).toFixed(1).replace('.', ',') + '&nbsp;%' : '&ndash;') + '</td>' +
        '<td class="zahl-rechts">' + euro(f) + '</td>' +
        '<td class="zahl-rechts" style="color:' + (ergebnis >= 0 ? 'var(--gruen)' : 'var(--rot)') + '"><b>' +
          euro(ergebnis) + '</b></td></tr>';
    }).join('');

    return { lohn: lohn, fix: fix, html:
      '<h3 class="abschnitt">Kosten und Ergebnis</h3>' +
      '<div class="rollen"><table><thead><tr><th>Filiale</th><th class="zahl-rechts">Umsatz</th>' +
      '<th class="zahl-rechts">Personalkosten</th><th class="zahl-rechts">Personalquote</th>' +
      '<th class="zahl-rechts">Fixkosten</th><th class="zahl-rechts">Ergebnis</th></tr></thead>' +
      '<tbody>' + zeilen + '</tbody></table></div>' +
      '<div class="aufteilung">Personalkosten aus: ' + lohn.quelle +
      '. Fixkosten anteilig aus den Monatswerten im Reiter Kosten.</div>'
    };
  }

  // ---------- Zeitraum-Auswahl (Dashboard und Verkaufsauswertung) ----------
  function periodeFelder(vor) {
    var art = el(vor + '-art').value;
    el(vor + '-feld-stichtag').classList.toggle('verstecken',
      art === 'gesamt' || art === 'individuell');
    el(vor + '-feld-von').classList.toggle('verstecken', art !== 'individuell');
    el(vor + '-feld-bis').classList.toggle('verstecken', art !== 'individuell');
  }

  function periodeLesen(vor) {
    var art = el(vor + '-art').value;
    var stichtag = el(vor + '-stichtag').value || heute.toISOString().slice(0, 10);
    var t = stichtag.split('-');

    if (art === 'tag')   return { von: stichtag, bis: stichtag, name: tagText(stichtag) };
    if (art === 'woche') {
      var mo = montagVon(stichtag);
      return { von: mo, bis: tagPlus(mo, 6), name: 'KW ' + kalenderwoche(mo) + ' ' + mo.slice(0, 4) };
    }
    if (art === 'monat') {
      var letzter = new Date(+t[0], +t[1], 0).getDate();
      return { von: t[0] + '-' + t[1] + '-01', bis: t[0] + '-' + t[1] + '-' + zwei(letzter),
               name: monatsnamen[+t[1] - 1] + ' ' + t[0] };
    }
    if (art === 'quartal') {
      var q = Math.floor((+t[1] - 1) / 3) + 1;
      return grenzen(+t[0], String(q));
    }
    if (art === 'jahr')   return grenzen(+t[0], 'jahr');
    if (art === 'gesamt') return { von: '0000-01-01', bis: '9999-12-31', name: 'Gesamter Zeitraum' };
    var von = el(vor + '-von').value || '0000-01-01';
    var bis = el(vor + '-bis').value || '9999-12-31';
    return { von: von, bis: bis, name: tagText(von) + ' bis ' + tagText(bis) };
  }

  // ---------- Mengen aus Bestellungen und Retouren ----------
  function mengenImZeitraum(z, nurFiliale) {
    var proArtikel = {};   // nr -> {bestellt, retour}
    var proFiliale = {};   // ort -> {bestellt, retour, wert, retourwert}

    function verbuchen(liste, feld) {
      liste.forEach(function (b) {
        if (!b.datumIso || b.datumIso < z.von || b.datumIso > z.bis) return;
        if (nurFiliale && b.filiale !== nurFiliale) return;
        proFiliale[b.filiale] = proFiliale[b.filiale] || { bestellt: 0, retour: 0, wert: 0, retourwert: 0 };
        b.posten.forEach(function (p) {
          var info = artikelInfo[p.nr] || {};
          var wert = p.menge * (info.vk || 0);
          proArtikel[p.nr] = proArtikel[p.nr] || { nr: p.nr, bez: p.bez || info.bez || '', bestellt: 0, retour: 0 };
          proArtikel[p.nr][feld] += p.menge;
          proFiliale[b.filiale][feld] += p.menge;
          proFiliale[b.filiale][feld === 'retour' ? 'retourwert' : 'wert'] += wert;
        });
      });
    }
    verbuchen(bestellungen, 'bestellt');
    verbuchen(retourenListe, 'retour');
    return { proArtikel: proArtikel, proFiliale: proFiliale };
  }

  // Errechneter Umsatz eines Tages: geliefert minus retourniert, zum Verkaufspreis
  function errechneterUmsatz(ort, tagIso) {
    var z = { von: tagIso, bis: tagIso };
    var d = mengenImZeitraum(z, ort).proFiliale[ort];
    if (!d) return 0;
    return Math.max(0, d.wert - d.retourwert);
  }

  // ---------- Monatliche Filialkosten ----------
  function monatskosten(ort) {
    var k = kosten[ort] || {};
    if (Number(k.pauschal) > 0) return Number(k.pauschal);
    return (Number(k.miete) || 0) + (Number(k.energie) || 0) + (Number(k.sonstiges) || 0) +
           personalkostenVertraglichProMonat(ort);
  }
  function kostenAnteil(ort, z) {
    var tage = Math.min(tageImZeitraum(z), 3650);
    return monatskosten(ort) * (tage / 30.44);
  }

  // ---------- Dashboard ----------
  var dashUmsatz = {};

  ['art', 'stichtag', 'von', 'bis', 'sortierung'].forEach(function (feld) {
    el('dash-' + feld).addEventListener('change', function () {
      periodeFelder('dash');
      dashboardLaden();
    });
  });
  el('dash-verkauf').addEventListener('click', function () { wechseln('verkauf'); });

  function dashboardLaden() {
    if (!el('dash-stichtag').value) el('dash-stichtag').value = heute.toISOString().slice(0, 10);
    periodeFelder('dash');
    var z = periodeLesen('dash');
    el('dashboard-inhalt').innerHTML = '<div class="leer">Zahlen werden geladen \u2026</div>';
    Promise.all([zeitraumLaden(z), personalHolen(), kostenHolen()]).then(function (e) {
      dashUmsatz = e[0];
      dashboardZeichnen(z);
    });
  }

  function dashboardZeichnen(z) {
    var umsatz = summieren(dashUmsatz, z.von, z.bis);
    var mengen = mengenImZeitraum(z);
    var orte = alleFilialen.slice();
    Object.keys(umsatz.proFiliale).forEach(function (o) { if (orte.indexOf(o) === -1) orte.push(o); });

    var zeilen = orte.map(function (ort) {
      var u = umsatz.proFiliale[ort] || 0;
      var k = kostenAnteil(ort, z);
      var m = mengen.proFiliale[ort] || { bestellt: 0, retour: 0, wert: 0, retourwert: 0 };
      return { ort: ort, umsatz: u, kosten: k, bereinigt: u - k,
               bestellt: m.bestellt, retour: m.retour, retourwert: m.retourwert };
    });

    var aufsteigend = el('dash-sortierung').value === 'auf';
    zeilen.sort(function (a, b) { return aufsteigend ? a.umsatz - b.umsatz : b.umsatz - a.umsatz; });
    dashZeilen = zeilen;

    var gesamtUmsatz = zeilen.reduce(function (s, r) { return s + r.umsatz; }, 0);
    var gesamtKosten = zeilen.reduce(function (s, r) { return s + r.kosten; }, 0);
    var gesamtRetour = zeilen.reduce(function (s, r) { return s + r.retourwert; }, 0);
    var gesamtWare = Object.keys(mengen.proFiliale).reduce(function (s, o) {
      return s + mengen.proFiliale[o].wert; }, 0);

    var kacheln =
      kachel(euro(gesamtUmsatz), 'Umsatz ' + z.name) +
      kachel(euro(gesamtKosten), 'Kosten') +
      kachel(euro(gesamtUmsatz - gesamtKosten), 'Bereinigt') +
      kachel(euro(gesamtWare), 'Warenwert geliefert') +
      kachel(euro(gesamtRetour), 'Retourenwert') +
      kachel(gesamtWare ? (gesamtRetour / gesamtWare * 100).toFixed(1).replace('.', ',') + ' %' : '\u2013',
             'Retourenquote');

    var maxU = Math.max.apply(null, zeilen.map(function (r) { return r.umsatz; }).concat([1]));

    el('dashboard-inhalt').innerHTML =
      '<div class="zahlen">' + kacheln + '</div>' +
      '<h3 class="abschnitt">Filial-Ranking \u00b7 ' + txt(z.name) + '</h3>' +
      zeilen.map(function (r) { return balken(r.ort, r.umsatz, maxU); }).join('') +
      '<div class="rollen" style="margin-top:12px"><table><thead><tr>' +
      '<th>#</th><th>Filiale</th><th class="zahl-rechts">Umsatz</th>' +
      '<th class="zahl-rechts">Kosten</th><th class="zahl-rechts">Bereinigt</th>' +
      '<th class="zahl-rechts">Retourenquote</th></tr></thead><tbody>' +
      zeilen.map(function (r, i) {
        var quote = (r.bestellt ? r.retour / r.bestellt * 100 : 0);
        return '<tr><td>' + (i + 1) + '</td><td><b>' + txt(r.ort) + '</b></td>' +
          '<td class="zahl-rechts">' + euro(r.umsatz) + '</td>' +
          '<td class="zahl-rechts">' + euro(r.kosten) + '</td>' +
          '<td class="zahl-rechts" style="color:' + (r.bereinigt >= 0 ? 'var(--gruen)' : 'var(--rot)') +
            '"><b>' + euro(r.bereinigt) + '</b></td>' +
          '<td class="zahl-rechts">' + (r.bestellt ? quote.toFixed(1).replace('.', ',') + '&nbsp;%' : '\u2013') +
          '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="aufteilung" style="margin-top:10px">Kosten anteilig aus dem Reiter Kosten. ' +
      'Die Liste rechnet sich neu, sobald eine Bestellung, eine Retoure oder ein Tagesumsatz eingeht.</div>';
  }

  var dashZeilen = [];
  el('dash-csv').addEventListener('click', function () {
    var z = periodeLesen('dash');
    var zeilen = [['Zeitraum', z.name], [],
      ['Rang', 'Filiale', 'Umsatz', 'Kosten', 'Bereinigt', 'Retourenquote %']];
    dashZeilen.forEach(function (r, i) {
      zeilen.push([String(i + 1), r.ort, r.umsatz.toFixed(2).replace('.', ','),
        r.kosten.toFixed(2).replace('.', ','), r.bereinigt.toFixed(2).replace('.', ','),
        r.bestellt ? (r.retour / r.bestellt * 100).toFixed(1).replace('.', ',') : '']);
    });
    csvSpeichern(zeilen, 'Filialranking_' + z.von + '_bis_' + z.bis + '.csv');
  });

  // ---------- Verkaufsauswertung ----------
  var verkaufZeilen = [];

  ['art', 'stichtag', 'von', 'bis', 'filiale', 'kennzahl', 'sortierung'].forEach(function (feld) {
    el('v-' + feld).addEventListener('change', function () {
      periodeFelder('v');
      verkaufZeichnen();
    });
  });

  function verkaufLaden() {
    if (!el('v-stichtag').value) el('v-stichtag').value = heute.toISOString().slice(0, 10);
    if (el('v-filiale').options.length <= 1) {
      alleFilialen.forEach(function (ort) {
        var o = document.createElement('option');
        o.value = ort; o.textContent = ort; el('v-filiale').appendChild(o);
      });
    }
    periodeFelder('v');
    verkaufZeichnen();
  }

  function verkaufZeichnen() {
    var z = periodeLesen('v');
    var ort = el('v-filiale').value;
    var daten = mengenImZeitraum(z, ort || null).proArtikel;

    var zeilen = Object.keys(daten).map(function (nr) {
      var d = daten[nr];
      var info = artikelInfo[nr] || {};
      var verkauft = Math.max(0, d.bestellt - d.retour);
      return { nr: nr, bez: d.bez || info.bez || '', bestellt: d.bestellt, retour: d.retour,
               verkauft: verkauft, umsatz: verkauft * (info.vk || 0),
               quote: d.bestellt ? d.retour / d.bestellt * 100 : 0 };
    });

    var kennzahl = el('v-kennzahl').value;
    var schluessel = kennzahl === 'umsatz' ? 'umsatz'
                   : kennzahl === 'retoure' ? 'quote'
                   : kennzahl === 'bestellt' ? 'bestellt' : 'verkauft';
    var auf = el('v-sortierung').value === 'auf';
    zeilen.sort(function (a, b) { return auf ? a[schluessel] - b[schluessel] : b[schluessel] - a[schluessel]; });
    verkaufZeilen = zeilen;

    var ziel = el('verkauf-inhalt');
    if (!zeilen.length) {
      ziel.innerHTML = '<div class="leer">F\u00fcr ' + txt(z.name) +
        (ort ? ' in ' + txt(ort) : '') + ' liegen keine Bestellungen vor.</div>';
      return;
    }

    var summeVerkauft = zeilen.reduce(function (s, r) { return s + r.verkauft; }, 0);
    var summeUmsatz = zeilen.reduce(function (s, r) { return s + r.umsatz; }, 0);
    var summeRetour = zeilen.reduce(function (s, r) { return s + r.retour; }, 0);
    var max = Math.max.apply(null, zeilen.map(function (r) { return r[schluessel]; }).concat([1]));

    ziel.innerHTML =
      '<div class="zahlen">' +
        kachel(summeVerkauft, 'Verkaufte St\u00fcck') +
        kachel(euro(summeUmsatz), 'Umsatz der Artikel') +
        kachel(summeRetour, 'Retour St\u00fcck') +
        kachel(zeilen.length, 'Artikel') + '</div>' +
      '<h3 class="abschnitt">' + txt(kennzahlName(kennzahl)) + ' \u00b7 ' + txt(z.name) +
        (ort ? ' \u00b7 ' + txt(ort) : ' \u00b7 alle Filialen') + '</h3>' +
      zeilen.slice(0, 10).map(function (r) {
        return balkenFrei(r.nr + '  ' + r.bez, r[schluessel], max,
          kennzahl === 'umsatz' ? euro(r.umsatz)
            : kennzahl === 'retoure' ? r.quote.toFixed(1).replace('.', ',') + ' %'
            : String(r[schluessel]) + ' St.');
      }).join('') +
      '<div class="rollen" style="margin-top:12px"><table><thead><tr>' +
      '<th>#</th><th>Nr.</th><th>Artikel</th><th class="zahl-rechts">Bestellt</th>' +
      '<th class="zahl-rechts">Retour</th><th class="zahl-rechts">Verkauft</th>' +
      '<th class="zahl-rechts">Umsatz</th><th class="zahl-rechts">Retourenquote</th></tr></thead><tbody>' +
      zeilen.map(function (r, i) {
        return '<tr><td>' + (i + 1) + '</td><td>' + txt(r.nr) + '</td><td>' + txt(r.bez) + '</td>' +
          '<td class="zahl-rechts">' + r.bestellt + '</td>' +
          '<td class="zahl-rechts">' + (r.retour || '\u2013') + '</td>' +
          '<td class="zahl-rechts"><b>' + r.verkauft + '</b></td>' +
          '<td class="zahl-rechts">' + euro(r.umsatz) + '</td>' +
          '<td class="zahl-rechts"' + (r.quote > 15 ? ' style="color:var(--rot)"' : '') + '>' +
            (r.bestellt ? r.quote.toFixed(1).replace('.', ',') + '&nbsp;%' : '\u2013') + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="aufteilung" style="margin-top:10px">Verkauft = bestellte Menge minus Retoure.</div>';
  }

  function kennzahlName(k) {
    return k === 'umsatz' ? 'Umsatzst\u00e4rkste Artikel'
         : k === 'retoure' ? 'H\u00f6chste Retourenquote'
         : k === 'bestellt' ? 'Meist bestellte Artikel' : 'Meist verkaufte Artikel';
  }

  function balkenFrei(name, wert, max, beschriftung) {
    var breite = max ? Math.max(2, wert / max * 100) : 2;
    return '<div class="balken"><div class="name">' + txt(name) + '</div>' +
      '<div class="spur"><div class="fuellung" style="width:' + breite.toFixed(1) + '%"></div></div>' +
      '<div class="wert">' + txt(beschriftung) + '</div></div>';
  }

  el('v-csv').addEventListener('click', function () {
    var z = periodeLesen('v');
    var zeilen = [['Zeitraum', z.name], ['Filiale', el('v-filiale').value || 'Alle Filialen'], [],
      ['Rang', 'Artikelnummer', 'Bezeichnung', 'Bestellt', 'Retour', 'Verkauft', 'Umsatz', 'Retourenquote %']];
    verkaufZeilen.forEach(function (r, i) {
      zeilen.push([String(i + 1), r.nr, r.bez, String(r.bestellt), String(r.retour),
        String(r.verkauft), r.umsatz.toFixed(2).replace('.', ','),
        r.bestellt ? r.quote.toFixed(1).replace('.', ',') : '']);
    });
    csvSpeichern(zeilen, 'Verkaufsauswertung_' + z.von + '_bis_' + z.bis + '.csv');
  });

  el('v-pdf').addEventListener('click', function () {
    if (!window.jspdf || !verkaufZeilen.length) return;
    var z = periodeLesen('v');
    var ort = el('v-filiale').value || 'Alle Filialen';
    var doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4' });
    doc.setFont('helvetica', 'bold'); doc.setFontSize(17); doc.setTextColor(46, 42, 121);
    doc.text('Verkaufsauswertung', 40, 52);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90, 90, 90);
    doc.text(entziffert(z.name) + ' - ' + entziffert(ort) + ' - ' + entziffert(kennzahlName(el('v-kennzahl').value)), 40, 68);
    doc.setDrawColor(46, 42, 121); doc.setLineWidth(1.5); doc.line(40, 76, 555, 76);
    doc.autoTable({
      startY: 92,
      head: [['#', 'Nr.', 'Artikel', 'Bestellt', 'Retour', 'Verkauft', 'Umsatz']],
      body: verkaufZeilen.map(function (r, i) {
        return [String(i + 1), r.nr, r.bez, String(r.bestellt), String(r.retour),
          String(r.verkauft), euroText(r.umsatz)];
      }),
      styles: { font: 'helvetica', fontSize: 8.5, cellPadding: 3.5 },
      headStyles: { fillColor: [46, 42, 121], textColor: 255 },
      columnStyles: { 3: { halign: 'right' }, 4: { halign: 'right' },
                      5: { halign: 'right', fontStyle: 'bold' }, 6: { halign: 'right' } },
      margin: { left: 40, right: 40 }
    });
    doc.save('Verkaufsauswertung_' + z.von + '_bis_' + z.bis + '.pdf');
  });

  // ---------- Meldungen ----------
  function melde(text, art) {
    el('meldung').innerHTML = text ? '<div class="meldung ' + art + '">' + txt(text) + '</div>' : '';
  }
</script>
</body>
</html>
