<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bäcker Jung – Bestellung und Retoure</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Inter:wght@400;500;600&display=swap');

  :root {
    --blau:   #2E2A79;
    --blau-h: #4A44B0;
    --gelb:   #FFC800;
    --papier: #FBFAF6;
    --linie:  #DDDAE8;
    --grau:   #6B6880;
    --gruen:  #1E7B45;
    --rot:    #B32B28;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { max-width: 100%; overflow-x: hidden; }

  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--papier);
    color: #17162B;
    padding-bottom: 96px;
    overflow-wrap: break-word;
  }

  header {
    background: var(--blau);
    color: #fff;
    padding: 10px 14px;
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 11px;
  }
  header img {
    height: 34px; width: auto; flex: 0 0 auto;
    background: #fff; border-radius: 8px; padding: 4px 6px;
  }
  header h1 {
    font-family: 'Nunito', sans-serif; font-weight: 800;
    font-size: 17px; margin: 0; flex: 1; min-width: 0;
  }
  header h1 small {
    display: block; font-family: 'Inter', sans-serif;
    font-size: 11px; font-weight: 600; opacity: .75;
  }

  main { max-width: 720px; margin: 0 auto; padding: 16px 14px 0; }

  .karte {
    background: #fff; border: 1px solid var(--linie);
    border-radius: 12px; padding: 14px; margin-bottom: 14px; max-width: 100%;
  }

  label.feldname {
    display: block; font-size: 11px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase;
    color: var(--grau); margin-bottom: 5px;
  }

  select, input[type=date], input[type=text], input[type=search], textarea {
    width: 100%; font-family: inherit; font-size: 16px;
    padding: 11px 12px; border: 1px solid var(--linie);
    border-radius: 9px; background: #fff; color: inherit;
  }
  select:focus, input:focus, textarea:focus {
    outline: none; border-color: var(--blau);
    box-shadow: 0 0 0 3px rgba(46,42,121,.12);
  }
  .zweispaltig { display: flex; gap: 10px; flex-wrap: wrap; }
  .zweispaltig > div { flex: 1 1 150px; min-width: 0; }

  /* ---------- Startseite ---------- */
  .start { max-width: 420px; margin: 8vh auto 0; }
  .start h2 { font-family: 'Nunito', sans-serif; font-size: 21px; margin: 0 0 6px; }
  .start p { color: var(--grau); font-size: 13.5px; line-height: 1.5; margin: 0 0 18px; }

  .wahl { display: flex; gap: 10px; margin-top: 14px; }
  .wahl button {
    flex: 1; font-family: inherit; font-size: 15px; font-weight: 600;
    padding: 15px 12px; border-radius: 11px; cursor: pointer;
    border: 1px solid var(--linie); background: #fff; color: var(--blau);
  }
  .wahl button.an { background: var(--blau); border-color: var(--blau); color: #fff; }

  button.haupt {
    width: 100%; font-family: inherit; font-size: 15px; font-weight: 600;
    padding: 14px 20px; border: none; border-radius: 10px;
    background: var(--blau); color: #fff; cursor: pointer; margin-top: 14px;
  }
  button.haupt:active { background: var(--blau-h); }

  .zurueck {
    font-family: inherit; font-size: 13px; font-weight: 600;
    background: none; border: none; color: var(--blau);
    padding: 0 0 10px; cursor: pointer;
  }

  /* ---------- Suche ---------- */
  .suchzeile { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .suchzeile input { flex: 1; }
  .schalter {
    font-size: 13px; font-weight: 600; padding: 10px 12px;
    border: 1px solid var(--linie); border-radius: 9px;
    background: #fff; color: var(--grau); cursor: pointer; white-space: nowrap;
  }
  .schalter.an { background: var(--blau); border-color: var(--blau); color: #fff; }

  /* ---------- Artikelliste ---------- */
  .artikel {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 4px; border-bottom: 1px solid var(--linie);
  }
  .artikel:last-child { border-bottom: none; }
  .artikel.gefuellt { background: #FFFBEA; }
  .nr { flex: 0 0 42px; font-size: 12px; font-weight: 600; color: var(--grau); text-align: center; }
  .bez { flex: 1; min-width: 0; font-size: 14px; line-height: 1.25; }
  .bez small { display: block; color: var(--grau); font-size: 11px; }
  .bez small b { color: var(--blau); }

  .zaehler { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
  .zaehler button {
    width: 34px; height: 34px; border: 1px solid var(--linie);
    background: #fff; border-radius: 8px;
    font-size: 18px; line-height: 1; color: var(--blau); cursor: pointer;
  }
  .zaehler button:active { background: #EFEDF8; }
  .zaehler input {
    width: 56px; height: 34px; text-align: center;
    font-size: 15px; font-weight: 600;
    border: 1px solid var(--linie); border-radius: 8px;
    background: #fff; font-family: inherit;
  }
  .zaehler input:focus { outline: none; border-color: var(--blau); }

  .leer { padding: 22px 4px; text-align: center; color: var(--grau); font-size: 14px; line-height: 1.6; }

  /* ---------- Fußleiste ---------- */
  .fuss {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: #fff; border-top: 1px solid var(--linie);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 12px;
    max-width: 720px; margin: 0 auto;
    box-shadow: 0 -4px 16px rgba(23,22,43,.07);
  }
  .fuss .summe { flex: 1; font-size: 13px; line-height: 1.3; min-width: 0; }
  .fuss .summe b { display: block; font-size: 15px; }
  .fuss .summe span { color: var(--grau); }

  button.senden {
    font-family: inherit; font-size: 15px; font-weight: 600;
    padding: 13px 20px; border: none; border-radius: 10px;
    background: var(--blau); color: #fff; cursor: pointer;
  }
  button.senden:disabled { background: #C9C6D8; cursor: not-allowed; }
  button.senden:not(:disabled):active { background: var(--blau-h); }

  /* ---------- Meldungen ---------- */
  .meldung {
    margin: 0 0 14px; padding: 12px 14px;
    border-radius: 10px; font-size: 14px; border-left: 4px solid;
  }
  .meldung.fehler  { background: #FBF0EF; border-color: var(--rot);  color: var(--rot); }
  .meldung.ladend  { background: #F4F2FB; border-color: var(--blau); color: var(--blau); }
  .meldung.hinweis { background: #FFFBEA; border-color: var(--gelb); color: #6B5200; }
  .meldung.gut     { background: #EEF7F1; border-color: var(--gruen); color: var(--gruen); }

  .fertig { text-align: center; padding: 40px 20px; }
  .fertig .haken {
    width: 64px; height: 64px; margin: 0 auto 16px;
    border-radius: 50%; background: var(--gruen); color: #fff;
    font-size: 34px; line-height: 64px;
  }
  .fertig h2 { font-family: 'Nunito', sans-serif; font-size: 22px; margin: 0 0 8px; }
  .fertig p { color: var(--grau); font-size: 14px; margin: 0 0 22px; line-height: 1.5; }
  .fertig button {
    font-family: inherit; font-size: 15px; font-weight: 600;
    padding: 12px 22px; border: 1px solid var(--linie);
    border-radius: 10px; background: #fff; color: var(--blau); cursor: pointer;
  }

  .verstecken { display: none !important; }
</style>
</head>

  <h1 id="kopf-titel">B&auml;cker Jung
    <small id="kopf-unter">Bestellung und Retoure</small>
  </h1>
</header>

<!-- Formulare für die Netlify-Erkennung -->
<form name="bestellung" data-netlify="true" enctype="multipart/form-data" hidden>
  <input type="text" name="filiale"><input type="text" name="datum">
  <input type="text" name="besteller"><input type="text" name="positionen">
  <input type="text" name="stueck"><input type="text" name="warenwert">
  <input type="text" name="bemerkung"><textarea name="uebersicht"></textarea>
  <input type="file" name="csv"><input type="file" name="pdf">
</form>
<form name="retoure" data-netlify="true" enctype="multipart/form-data" hidden>
  <input type="text" name="filiale"><input type="text" name="datum">
  <input type="text" name="besteller"><input type="text" name="positionen">
  <input type="text" name="stueck"><input type="text" name="retourenwert">
  <input type="text" name="quote"><input type="text" name="bemerkung">
  <textarea name="uebersicht"></textarea>
  <input type="file" name="csv"><input type="file" name="pdf">
</form>

<main id="haupt">

  <!-- ---------- Startseite ---------- -->
  <div class="start" id="start">
    <div class="karte">
      <h2>Anmelden</h2>
      <p>Bitte ausw&auml;hlen, wer die Seite benutzt.</p>
      <label class="feldname" for="rolle">Ich bin</label>
      <select id="rolle">
        <option value="">Bitte w&auml;hlen &hellip;</option>
        <option value="filiale">Filiale</option>
        <option value="chef">Gesch&auml;ftsf&uuml;hrung</option>
      </select>

      <div id="rolle-filiale" class="verstecken">
        <div class="wahl">
          <button type="button" id="wahl-bestellung">Bestellung</button>
          <button type="button" id="wahl-retoure">Retoure</button>
        </div>
      </div>

      <div id="rolle-chef" class="verstecken">
        <button class="haupt" type="button" onclick="location.href='chef.html'">Zur Chef-Ansicht</button>
      </div>
    </div>
  </div>

  <!-- ---------- Bestellung ---------- -->
  <div id="bereich-bestellung" class="verstecken">
    <button class="zurueck" type="button" data-zurueck>&larr; Zur&uuml;ck zur Auswahl</button>
    <div id="meldung-b"></div>

    <div class="karte">
      <div class="zweispaltig">
        <div>
          <label class="feldname" for="b-filiale">Filiale</label>
          <select id="b-filiale"><option value="">Bitte w&auml;hlen &hellip;</option></select>
        </div>
        <div>
          <label class="feldname" for="b-datum">Liefertag (= Bestelldatum)</label>
          <input type="date" id="b-datum">
        </div>
      </div>
      <div style="margin-top:10px">
        <label class="feldname" for="b-besteller">Bestellt von</label>
        <input type="text" id="b-besteller" placeholder="Vor- und Nachname"
               autocomplete="name" autocapitalize="words">
      </div>
    </div>

    <div class="karte">
      <div class="suchzeile">
        <input type="search" id="b-suche" placeholder="Artikel suchen &hellip;" autocomplete="off">
        <button class="schalter" id="b-nur-gefuellt" type="button">Nur Bestellte</button>
      </div>
      <div id="b-liste"></div>
    </div>

    <div class="karte">
      <label class="feldname" for="b-bemerkung">Bemerkung (optional)</label>
      <textarea id="b-bemerkung" rows="2" placeholder="z. B. Lieferung bitte fr&uuml;her"></textarea>
    </div>
  </div>

  <!-- ---------- Retoure ---------- -->
  <div id="bereich-retoure" class="verstecken">
    <button class="zurueck" type="button" data-zurueck>&larr; Zur&uuml;ck zur Auswahl</button>
    <div id="meldung-r"></div>

    <div class="karte">
      <div class="zweispaltig">
        <div>
          <label class="feldname" for="r-filiale">Filiale</label>
          <select id="r-filiale"><option value="">Bitte w&auml;hlen &hellip;</option></select>
        </div>
        <div>
          <label class="feldname" for="r-datum">Tag der Retoure</label>
          <input type="date" id="r-datum">
        </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
  var artikel = [], filialen = [], artikelNach = {};
  var mengen = {};        // Bestellung: nr -> Menge
  var retouren = {};      // Retoure:    nr -> Menge
  var geliefert = {};     // Retoure:    nr -> gelieferte Menge des Tages
  var lieferungGeladen = false;
  var nurGefuelltB = false, nurGefuelltR = false;
  var modus = '';         // 'bestellung' oder 'retoure'

  function el(id) { return document.getElementById(id); }
  function txt(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function euro(n) { return n.toFixed(2).replace('.', ',') + ' \u20ac'; }
  function heuteIso() { return new Date().toISOString().slice(0, 10); }

  el('b-datum').value = heuteIso();
  el('r-datum').value = heuteIso();

  try {
    var VORDATEN = JSON.parse(el('vordaten').textContent);
    artikel  = VORDATEN.artikel || [];
    filialen = VORDATEN.filialen || [];
    artikel.forEach(function (a) { artikelNach[a.nr] = a; });
    ['b-filiale', 'r-filiale'].forEach(function (id) {
      filialen.forEach(function (f, i) {
        var o = document.createElement('option');
        o.value = f.ort;
        o.textContent = f.ort + (f.strasse ? ' \u2013 ' + f.strasse : '');
        o.dataset.strasse = f.strasse || '';
        el(id).appendChild(o);
      });
    });
  } catch (fehler) {
    document.body.innerHTML = '<p style="padding:20px">Die Artikelliste konnte nicht geladen werden.</p>';
  }

  // ---------- Rollenwahl ----------
  el('rolle').addEventListener('change', function () {
    var wert = el('rolle').value;
    el('rolle-filiale').classList.toggle('verstecken', wert !== 'filiale');
    el('rolle-chef').classList.toggle('verstecken', wert !== 'chef');
  });

  el('wahl-bestellung').addEventListener('click', function () { starte('bestellung'); });
  el('wahl-retoure').addEventListener('click', function () { starte('retoure'); });

  document.querySelectorAll('[data-zurueck]').forEach(function (b) {
    b.addEventListener('click', function () { location.reload(); });
  });

  function starte(welcher) {
    modus = welcher;
    el('start').classList.add('verstecken');
    el('bereich-bestellung').classList.toggle('verstecken', welcher !== 'bestellung');
    el('bereich-retoure').classList.toggle('verstecken', welcher !== 'retoure');
    el('fuss').classList.remove('verstecken');
    el('senden').textContent = welcher === 'retoure' ? 'Retoure senden' : 'Bestellung senden';
    el('kopf-unter').textContent = welcher === 'retoure' ? 'Retoure melden' : 'Bestellung aufgeben';
    if (welcher === 'bestellung') listeBestellungZeichnen(); else summeZeichnen();
  }

  // ---------- Bestellung ----------
  function listeBestellungZeichnen() {
    var suchtext = el('b-suche').value.trim().toLowerCase();
    var ziel = el('b-liste');
    ziel.innerHTML = '';
    var gezeigt = 0;

    artikel.forEach(function (a) {
      var menge = mengen[a.nr] || 0;
      if (nurGefuelltB && menge <= 0) return;
      if (suchtext && a.bez.toLowerCase().indexOf(suchtext) === -1 && a.nr.indexOf(suchtext) !== 0) return;
      gezeigt++;
      ziel.appendChild(zeile(a, menge, 'b', ''));
    });

    if (!gezeigt) {
      ziel.innerHTML = '<div class="leer">' +
        (nurGefuelltB ? 'Es ist noch keine Menge eingetragen.' : 'Kein Artikel gefunden.') + '</div>';
    }
    knoepfeBinden(ziel, 'b');
  }

  function zeile(a, menge, art, zusatz) {
    var d = document.createElement('div');
    d.className = 'artikel' + (menge > 0 ? ' gefuellt' : '');
    d.innerHTML =
      '<div class="nr">' + txt(a.nr) + '</div>' +
      '<div class="bez">' + txt(a.bez) +
        '<small>' + txt(a.einheit || '') +
        (a.vk ? ' \u00b7 ' + euro(a.vk) : '') + zusatz + '</small></div>' +
      '<div class="zaehler">' +
        '<button type="button" data-minus="' + txt(a.nr) + '">\u2212</button>' +
        '<input type="number" inputmode="numeric" min="0" step="1" ' +
               'data-nr="' + txt(a.nr) + '" value="' + (menge > 0 ? menge : '') + '">' +
        '<button type="button" data-plus="' + txt(a.nr) + '">+</button>' +
      '</div>';
    return d;
  }

  function knoepfeBinden(ziel, art) {
    ziel.querySelectorAll('input[data-nr]').forEach(function (feld) {
      feld.addEventListener('input', function () {
        setzen(art, feld.dataset.nr, parseInt(feld.value, 10) || 0, false);
      });
      feld.addEventListener('blur', function () { neuZeichnen(art); });
    });
    ziel.querySelectorAll('button[data-plus]').forEach(function (b) {
      b.addEventListener('click', function () {
        var topf = art === 'b' ? mengen : retouren;
        setzen(art, b.dataset.plus, (topf[b.dataset.plus] || 0) + 1, true);
      });
    });
    ziel.querySelectorAll('button[data-minus]').forEach(function (b) {
      b.addEventListener('click', function () {
        var topf = art === 'b' ? mengen : retouren;
        setzen(art, b.dataset.minus, (topf[b.dataset.minus] || 0) - 1, true);
      });
    });
  }

  function setzen(art, nr, wert, neu) {
    var topf = art === 'b' ? mengen : retouren;
    if (art === 'r' && geliefert[nr] !== undefined && wert > geliefert[nr]) {
      wert = geliefert[nr];   // nie mehr zurück als geliefert
      melde('r', 'Es kann h\u00f6chstens die gelieferte Menge zur\u00fcckgegeben werden.', 'hinweis');
    }
    if (wert > 0) topf[nr] = wert; else delete topf[nr];
    summeZeichnen();
    if (neu) neuZeichnen(art);
  }

  function neuZeichnen(art) {
    if (art === 'b') listeBestellungZeichnen(); else listeRetoureZeichnen();
  }

  el('b-suche').addEventListener('input', listeBestellungZeichnen);
  el('b-nur-gefuellt').addEventListener('click', function () {
    nurGefuelltB = !nurGefuelltB;
    el('b-nur-gefuellt').classList.toggle('an', nurGefuelltB);
    listeBestellungZeichnen();
  });

  // ---------- Retoure ----------
  el('r-filiale').addEventListener('change', lieferungLaden);
  el('r-datum').addEventListener('change', lieferungLaden);
  el('r-suche').addEventListener('input', listeRetoureZeichnen);
  el('r-nur-gefuellt').addEventListener('click', function () {
    nurGefuelltR = !nurGefuelltR;
    el('r-nur-gefuellt').classList.toggle('an', nurGefuelltR);
    listeRetoureZeichnen();
  });

  function lieferungLaden() {
    var ort = el('r-filiale').value, tag = el('r-datum').value;
    geliefert = {}; retouren = {}; lieferungGeladen = false;
    summeZeichnen();
    if (!ort || !tag) { listeRetoureZeichnen(); return; }

    melde('r', 'Lieferung dieses Tages wird geladen \u2026', 'ladend');
    fetch('/.netlify/functions/bestellungen', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ aktion: 'tagesbestellung', filiale: ort, datum: tag })
    })
    .then(function (a) { if (!a.ok) throw new Error('Status ' + a.status); return a.json(); })
    .then(function (d) {
      (d.positionen || []).forEach(function (p) {
        geliefert[p.nr] = (geliefert[p.nr] || 0) + (parseInt(p.menge, 10) || 0);
      });
      lieferungGeladen = true;
      var anzahl = Object.keys(geliefert).length;
      melde('r', anzahl
        ? 'Lieferung geladen: ' + anzahl + ' Artikel. Die Retoure wird damit abgeglichen.'
        : 'F\u00fcr diesen Tag liegt keine Bestellung vor. Die Retoure kann trotzdem gemeldet werden.',
        anzahl ? 'gut' : 'hinweis');
      listeRetoureZeichnen();
    })
    .catch(function () {
      melde('r', 'Die Lieferung konnte nicht geladen werden. Die Retoure l\u00e4sst sich trotzdem melden.', 'hinweis');
      listeRetoureZeichnen();
    });
  }

  function listeRetoureZeichnen() {
    var suchtext = el('r-suche').value.trim().toLowerCase();
    var ziel = el('r-liste');
    ziel.innerHTML = '';

    // Wenn eine Lieferung bekannt ist, nur diese Artikel zeigen
    var quelle = Object.keys(geliefert).length
      ? artikel.filter(function (a) { return geliefert[a.nr] > 0; })
      : artikel;

    var gezeigt = 0;
    quelle.forEach(function (a) {
      var menge = retouren[a.nr] || 0;
      if (nurGefuelltR && menge <= 0) return;
      if (suchtext && a.bez.toLowerCase().indexOf(suchtext) === -1 && a.nr.indexOf(suchtext) !== 0) return;
      gezeigt++;
      var zusatz = geliefert[a.nr]
        ? ' \u00b7 geliefert <b>' + geliefert[a.nr] + '</b>' +
          (menge > 0 ? ' \u00b7 Quote ' + (menge / geliefert[a.nr] * 100).toFixed(0) + ' %' : '')
        : '';
      ziel.appendChild(zeile(a, menge, 'r', zusatz));
    });

    if (!gezeigt) {
      ziel.innerHTML = '<div class="leer">' +
        (nurGefuelltR ? 'Es ist noch keine Retoure eingetragen.'
          : (el('r-filiale').value ? 'Kein Artikel gefunden.'
             : 'Filiale und Tag w\u00e4hlen \u2013 dann wird die Lieferung geladen.')) + '</div>';
    }
    knoepfeBinden(ziel, 'r');
  }

  // ---------- Summe ----------
  function summeZeichnen() {
    var topf = modus === 'retoure' ? retouren : mengen;
    var positionen = 0, stueck = 0, wert = 0;
    for (var nr in topf) {
      positionen++; stueck += topf[nr];
      wert += topf[nr] * ((artikelNach[nr] || {}).vk || 0);
    }
    el('summe-zahl').textContent = positionen + (positionen === 1 ? ' Position' : ' Positionen');
    el('summe-text').textContent = positionen
      ? stueck + ' St\u00fcck \u00b7 ' + euro(wert)
      : 'noch nichts eingetragen';
    el('senden').disabled = (positionen === 0);
  }

  // ---------- CSV ----------
  function csvFeld(w) {
    var s = String(w);
    return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function csvText(reihen) {
    return reihen.map(function (r) { return r.map(csvFeld).join(';'); }).join('\r\n') + '\r\n';
  }

  // ---------- PDF Bestellung ----------
  function pdfBestellung(f, datumText, besteller, bemerkung, positionen, stueck, wert) {
    var doc = kopfPdf('Bestellung', f, datumText, besteller, 'Liefertag:');
    doc.autoTable({
      startY: 172,
      head: [['Art.-Nr.', 'Bezeichnung', 'Menge', 'Einheit']],
      body: positionen.map(function (p) { return [p.nr, p.bez, String(p.menge), p.einheit || '']; }),
      styles: { font: 'helvetica', fontSize: 9, cellPadding: 4 },
      headStyles: { fillColor: [46, 42, 121], textColor: 255, fontSize: 9 },
      columnStyles: { 0: { cellWidth: 55, halign: 'center' },
                      2: { cellWidth: 55, halign: 'right', fontStyle: 'bold' },
                      3: { cellWidth: 60, halign: 'center' } },
      margin: { left: 40, right: 40 }
    });
    var ende = doc.lastAutoTable.finalY + 20;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
    doc.text(positionen.length + ' Positionen  \u00b7  ' + stueck + ' Stueck  \u00b7  Warenwert ' +
             wert.toFixed(2).replace('.', ',') + ' EUR', 40, ende);
    if (bemerkung) {
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
      doc.text(doc.splitTextToSize('Bemerkung der Filiale: ' + bemerkung, 515), 40, ende + 20);
    }
    return doc.output('blob');
  }

  // ---------- PDF Retoure mit Auswertung ----------
  function pdfRetoure(f, datumText, melder, bemerkung, positionen, stueck, wert, gesamtGeliefert) {
    var doc = kopfPdf('Retoure', f, datumText, melder, 'Retourentag:');

    doc.autoTable({
      startY: 172,
      head: [['Art.-Nr.', 'Bezeichnung', 'Geliefert', 'Retoure', 'Quote', 'Kosten']],
      body: positionen.map(function (p) {
        return [p.nr, p.bez,
          p.geliefert ? String(p.geliefert) : '-',
          String(p.menge),
          p.geliefert ? (p.menge / p.geliefert * 100).toFixed(1).replace('.', ',') + ' %' : '-',
          (p.menge * (p.vk || 0)).toFixed(2).replace('.', ',') + ' EUR'];
      }),
      styles: { font: 'helvetica', fontSize: 9, cellPadding: 4 },
      headStyles: { fillColor: [46, 42, 121], textColor: 255, fontSize: 9 },
      columnStyles: { 0: { cellWidth: 52, halign: 'center' },
                      2: { cellWidth: 58, halign: 'right' },
                      3: { cellWidth: 55, halign: 'right', fontStyle: 'bold' },
                      4: { cellWidth: 50, halign: 'right' },
                      5: { cellWidth: 70, halign: 'right' } },
      margin: { left: 40, right: 40 }
    });

    var y = doc.lastAutoTable.finalY + 24;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
    doc.setTextColor(46, 42, 121);
    doc.text('Auswertung', 40, y);
    doc.setTextColor(20, 20, 20);

    var quote = gesamtGeliefert ? (stueck / gesamtGeliefert * 100) : 0;
    var sortiert = positionen.slice().sort(function (a, b) {
      var qa = a.geliefert ? a.menge / a.geliefert : 0;
      var qb = b.geliefert ? b.menge / b.geliefert : 0;
      return qb - qa;
    }).slice(0, 5);

    doc.autoTable({
      startY: y + 10,
      head: [['Kennzahl', 'Wert']],
      body: [
        ['Retournierte Positionen', String(positionen.length)],
        ['Retournierte Menge', stueck + ' Stueck'],
        ['Gelieferte Menge des Tages', gesamtGeliefert ? gesamtGeliefert + ' Stueck' : 'unbekannt'],
        ['Retourenquote gesamt', gesamtGeliefert ? quote.toFixed(1).replace('.', ',') + ' %' : '-'],
        ['Retourenkosten', wert.toFixed(2).replace('.', ',') + ' EUR']
      ],
      styles: { font: 'helvetica', fontSize: 9, cellPadding: 4 },
      headStyles: { fillColor: [46, 42, 121], textColor: 255 },
      columnStyles: { 1: { halign: 'right', fontStyle: 'bold', cellWidth: 150 } },
      margin: { left: 40, right: 40 }
    });

    if (sortiert.length && gesamtGeliefert) {
      doc.autoTable({
        startY: doc.lastAutoTable.finalY + 18,
        head: [['Hoechste Quoten', 'Geliefert', 'Retoure', 'Quote']],
        body: sortiert.map(function (p) {
          return [p.nr + '  ' + p.bez, String(p.geliefert || '-'), String(p.menge),
            p.geliefert ? (p.menge / p.geliefert * 100).toFixed(1).replace('.', ',') + ' %' : '-'];
        }),
        styles: { font: 'helvetica', fontSize: 9, cellPadding: 4 },
        headStyles: { fillColor: [107, 104, 128], textColor: 255 },
        columnStyles: { 1: { halign: 'right' }, 2: { halign: 'right' }, 3: { halign: 'right' } },
        margin: { left: 40, right: 40 }
      });
    }

    if (bemerkung) {
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
      doc.text(doc.splitTextToSize('Bemerkung der Filiale: ' + bemerkung, 515),
               40, doc.lastAutoTable.finalY + 22);
    }
    return doc.output('blob');
  }

  function kopfPdf(titel, f, datumText, person, datumsName) {
    var doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4' });
    doc.setFont('helvetica', 'bold'); doc.setFontSize(17);
    doc.setTextColor(46, 42, 121);
    doc.text(titel, 40, 52);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
    doc.setTextColor(90, 90, 90);
    doc.text('Baeckerei Jung, Walter Eucken Str. 11, 66877 Ramstein-Miesenbach', 40, 68);
    doc.setDrawColor(46, 42, 121); doc.setLineWidth(1.5);
    doc.line(40, 76, 555, 76);
    doc.setTextColor(20, 20, 20); doc.setFontSize(11);
    var y = 98;
    [['Filiale:', f.ort], ['Anschrift:', f.strasse || '-'],
     [datumsName, datumText], ['Gemeldet von:', person]].forEach(function (p) {
      doc.setFont('helvetica', 'bold'); doc.text(p[0], 40, y);
      doc.setFont('helvetica', 'normal'); doc.text(String(p[1]), 130, y);
      y += 16;
    });
    return doc;
  }

  // ---------- Senden ----------
  el('senden').addEventListener('click', function () {
    var retoure = (modus === 'retoure');
    var vor = retoure ? 'r' : 'b';
    var ort = el(vor + '-filiale').value;
    var datum = el(vor + '-datum').value;
    var person = el(vor + '-besteller').value.trim();
    var bemerkung = el(vor + '-bemerkung').value.trim();

    if (!ort)    { melde(vor, 'Bitte zuerst die Filiale ausw\u00e4hlen.', 'fehler'); return; }
    if (!datum)  { melde(vor, 'Bitte ein Datum eintragen.', 'fehler'); return; }
    if (!person) { melde(vor, 'Bitte eintragen, wer die Meldung abgibt.', 'fehler'); return; }

    var f = filialen.filter(function (x) { return x.ort === ort; })[0] || { ort: ort, strasse: '' };
    var t = datum.split('-');
    var datumText = t[2] + '.' + t[1] + '.' + t[0];

    var topf = retoure ? retouren : mengen;
    var positionen = [], stueck = 0, wert = 0;
    artikel.forEach(function (a) {
      if (topf[a.nr] > 0) {
        positionen.push({ nr: a.nr, bez: a.bez, einheit: a.einheit, vk: a.vk || 0,
                          menge: topf[a.nr], geliefert: geliefert[a.nr] || 0 });
        stueck += topf[a.nr];
        wert += topf[a.nr] * (a.vk || 0);
      }
    });
    var gesamtGeliefert = 0;
    for (var nr in geliefert) gesamtGeliefert += geliefert[nr];

    el('senden').disabled = true;
    el('senden').textContent = 'Wird gesendet \u2026';
    melde(vor, 'Wird gesendet \u2026', 'ladend');

    var basis = (retoure ? 'Retoure_' : 'Bestellung_') +
      f.ort.replace(/[^\wÄÖÜäöüß]+/g, '_') + '_' + datumText.replace(/\./g, '-');
    var csvDatei, pdfDatei, uebersicht;

    try {
      var reihen = retoure
        ? [['Filiale', 'Retourentag', 'Artikelnummer', 'Bezeichnung', 'Geliefert', 'Retoure',
            'Quote %', 'Kosten EUR', 'Gemeldet von']]
        : [['Kunde', 'Liefertag', 'Artikelnummer', 'Bezeichnung', 'Menge', 'Bestellt von']];
      positionen.forEach(function (p) {
        reihen.push(retoure
          ? [f.ort, datumText, p.nr, p.bez, String(p.geliefert || ''), String(p.menge),
             p.geliefert ? (p.menge / p.geliefert * 100).toFixed(1).replace('.', ',') : '',
             (p.menge * p.vk).toFixed(2).replace('.', ','), person]
          : [f.ort, datumText, p.nr, p.bez, String(p.menge), person]);
      });
      csvDatei = new File([new Blob(['\ufeff' + csvText(reihen)], { type: 'text/csv' })],
                          basis + '.csv', { type: 'text/csv' });

      var roh = retoure
        ? pdfRetoure(f, datumText, person, bemerkung, positionen, stueck, wert, gesamtGeliefert)
        : pdfBestellung(f, datumText, person, bemerkung, positionen, stueck, wert);
      pdfDatei = new File([roh], basis + '.pdf', { type: 'application/pdf' });

      uebersicht = positionen.map(function (p) {
        return retoure
          ? p.nr + '\t' + p.bez + '\t' + p.menge + '\t' + (p.geliefert || 0)
          : p.nr + '\t' + p.bez + '\t' + p.menge;
      }).join('\n');
    } catch (fehler) {
      melde(vor, 'Die Datei konnte nicht erzeugt werden: ' + fehler.message, 'fehler');
      zuruecksetzen(); return;
    }

    var paket = new FormData();
    paket.append('form-name', retoure ? 'retoure' : 'bestellung');
    paket.append('filiale', f.ort);
    paket.append('datum', datumText);
    paket.append('besteller', person);
    paket.append('positionen', String(positionen.length));
    paket.append('stueck', String(stueck));
    if (retoure) {
      paket.append('retourenwert', wert.toFixed(2).replace('.', ',') + ' EUR');
      paket.append('quote', gesamtGeliefert
        ? (stueck / gesamtGeliefert * 100).toFixed(1).replace('.', ',') + ' %' : '');
    } else {
      paket.append('warenwert', wert.toFixed(2).replace('.', ',') + ' EUR');
    }
    paket.append('bemerkung', bemerkung);
    paket.append('uebersicht', uebersicht);
    paket.append('csv', csvDatei);
    paket.append('pdf', pdfDatei);

    fetch('/', { method: 'POST', body: paket })
      .then(function (a) {
        if (!a.ok) throw new Error('Status ' + a.status);
        fertigZeigen(retoure, f.ort, datumText, person, positionen.length, stueck, wert);
      })
      .catch(function (fehler) {
        herunterladen(csvDatei); herunterladen(pdfDatei);
        melde(vor, 'Das Senden hat nicht geklappt (' + fehler.message + '). ' +
          'CSV und PDF wurden stattdessen auf dieses Ger\u00e4t geladen \u2013 bitte per E-Mail weiterleiten.', 'fehler');
        zuruecksetzen();
      });
  });

  function herunterladen(datei) {
    try {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(datei);
      a.download = datei.name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    } catch (e) {}
  }

  function zuruecksetzen() {
    el('senden').disabled = false;
    el('senden').textContent = modus === 'retoure' ? 'Retoure senden' : 'Bestellung senden';
  }

  function fertigZeigen(retoure, ort, datumText, person, anzahl, stueck, wert) {
    el('fuss').classList.add('verstecken');
    el('haupt').innerHTML =
      '<div class="fertig">' +
        '<div class="haken">\u2713</div>' +
        '<h2>' + (retoure ? 'Retoure gesendet' : 'Bestellung gesendet') + '</h2>' +
        '<p><b>' + txt(ort) + '</b> \u00b7 ' + txt(datumText) + ' \u00b7 ' + txt(person) + '<br>' +
          anzahl + ' Positionen, ' + stueck + ' St\u00fcck \u00b7 ' + euro(wert) + '<br>' +
          'Die B\u00e4ckerei hat CSV und PDF erhalten.</p>' +
        '<button type="button" onclick="location.reload()">Neue Eingabe</button>' +
      '</div>';
  }

  function melde(vor, text, art) {
    el('meldung-' + vor).innerHTML = text
      ? '<div class="meldung ' + art + '">' + txt(text) + '</div>' : '';
  }
</script>
</body>
</html>
